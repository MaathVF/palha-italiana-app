  const v = id ? {...S.Vendas.find(x => String(x.id) === String(id))} : {data:hoje(), quantidade:1, receita:S.Receitas.filter(ativo)[0]?.nome || S.Receitas[0].nome, status:'Pendente', forma_pagamento:'Pix'};
  let valorManual = !!id;
  const opts = (arr, sel) => arr.map(n => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const m = abrirModal(id ? 'Editar venda' : 'Nova venda', `
    <div class="duas"><div class="campo"><label for="v_data">Data</label><input type="date" id="v_data" value="${esc(v.data)}"></div>
      <div class="campo"><label for="v_cliente">Cliente</label><input id="v_cliente" list="dl_cli" value="${esc(v.cliente || '')}" autocomplete="off">
      <datalist id="dl_cli">${S.Clientes.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist></div></div>
    <div class="campo"><label>Receita</label><div class="chips" id="v_rec">${S.Receitas.filter(r => ativo(r) || r.nome === v.receita).map(r => `<button type="button" class="chip ${r.nome === v.receita ? 'on' : ''}" data-rec="${esc(r.nome)}">${esc(r.nome)}</button>`).join('')}</div></div>
    <div class="campo"><label>Preço / combo</label><div class="chips" id="v_precos"></div></div>
    <div class="duas"><div class="campo"><label for="v_qtd">Quantidade</label><div class="stepper"><button type="button" data-q="-1" aria-label="Menos">−</button><input id="v_qtd" type="number" min="1" inputmode="numeric" value="${num(v.quantidade) || 1}"><button type="button" data-q="1" aria-label="Mais">+</button></div></div>
      <div class="campo"><label for="v_valor">Valor (R$)</label><input id="v_valor" type="number" step="0.01" inputmode="decimal" value="${v.valor ?? ''}"></div></div>
    <div class="duas"><div class="campo"><label for="v_local">Local</label><select id="v_local"><option value="">—</option>${opts(S.Locais.map(l => l.nome), v.local)}</select></div>
      <div class="campo"><label for="v_lotebtn">Lote</label><button type="button" class="lote-campo" id="v_lotebtn"></button><input type="hidden" id="v_lote"></div></div>
    <div class="campo" id="v_rendbox"><label for="v_rend">Rendimento da fornada</label><input id="v_rend" type="number" inputmode="numeric" placeholder="Padrão" value="${v.rendimento || ''}"></div>
    <div class="campo"><label>Pagamento</label><div class="seg" id="v_status"><button type="button" data-st="Pendente">Pendente</button><button type="button" data-st="Pago">Pago</button></div></div>
    <div class="duas" id="v_pago"><div class="campo"><label for="v_forma">Forma</label><select id="v_forma">${opts(['Pix','Dinheiro','Cartão'], v.forma_pagamento)}</select></div>
      <div class="campo"><label for="v_dpag">Data do pagamento</label><input type="date" id="v_dpag" value="${esc(v.data_pagamento || hoje())}"></div></div>
    <input type="hidden" id="v_combo" value="${esc(v.combo || '')}">
    <div class="campo"><label for="v_obs">Observação</label><input id="v_obs" value="${esc(v.observacao || '')}"></div>
    <div class="previa num" id="v_prev"></div>`,
    {salvar:'Salvar venda', excluir: !!id});

  const q = s => m.querySelector(s);
  let st = v.status === 'Pago' ? 'Pago' : 'Pendente';
  const loteSel = () => loteDe(q('#v_lote').value);
  const lerV = () => ({ data:q('#v_data').value, cliente:q('#v_cliente').value.trim(), receita:v.receita, quantidade:num(q('#v_qtd').value),
    lote: loteSel() ? loteSel().id : '',
    rendimento: loteSel() ? num(loteSel().rendimento_real) : (q('#v_rend').value ? num(q('#v_rend').value) : ''), combo:q('#v_combo').value, valor:num(q('#v_valor').value),
    local:q('#v_local').value, status:st, forma_pagamento: st === 'Pago' ? q('#v_forma').value : '',
    data_pagamento: st === 'Pago' ? q('#v_dpag').value : '', observacao:q('#v_obs').value.trim() });
  const prev = () => {
    const c = calcVenda(lerV());
    q('#v_prev').innerHTML = `<span>Custo de preparo</span><b>${brl(c.custo_preparo)}</b><span>Repasse</span><b>${brl(c.repasse)}</b>
      <span>Reserva</span><b>${brl(c.reserva)}</b><div class="tot"><span>Lucro disponível</span><span>${brl(c.lucro_disponivel)}</span></div>${avisoLote()}`;
  };
  const avisoLote = () => {
    const f = loteSel(); if (!f) return '';
    const rest = resumoLote(f).rest + (id && String(v.lote) === String(f.id) ? num(v.quantidade) : 0);
    return num(q('#v_qtd').value) > rest ? `<div class="alerta">${nomeLote(f)} tem só ${rest} ${rest === 1 ? 'unidade restante' : 'unidades restantes'}.</div>` : '';
  };
  /* ---- Lote: escolha em janela própria ---- */
  let loteOk = !!id;
  const lotesAbertos = () => lotesDe(v.receita).filter(f => resumoLote(f).rest > 0);
  const desenharLoteBtn = () => {
    const f = loteSel(), b = q('#v_lotebtn');
    let t = 'Sem lote (preço atual)';
    if (f){ const rest = resumoLote(f).rest + (id && String(v.lote) === String(f.id) ? num(v.quantidade) : 0); t = `${nomeLote(f)} · ${dataBR(f.data)} · ${rest} ${rest === 1 ? 'resta' : 'restam'}`; }
    b.innerHTML = esc(t) + (loteOk ? '' : '<small>Toque para confirmar o lote</small>');
    b.classList.toggle('pendente', !loteOk);
    q('#v_rendbox').style.display = f ? 'none' : '';
  };
  const setLote = (lid, confirmado) => { q('#v_lote').value = lid || ''; loteOk = confirmado; desenharLoteBtn(); prev(); };
  const iniciarLote = () => {
    const ab = lotesAbertos();
    q('#v_lote').value = ab[0]?.id || loteSugerido(v.receita)?.id || '';
    loteOk = ab.length < 2;        // com 2 ou mais lotes em venda, pergunta de qual saiu
    desenharLoteBtn();
  };
  const abrirPicker = depois => {
    const sel = q('#v_lote').value; let todos = false;
    const div = document.createElement('div'); div.className = 'picker'; div.setAttribute('role', 'dialog'); div.setAttribute('aria-label', 'Escolher lote');
    m.appendChild(div);
    const desenhar = () => {
      const tudo = lotesDe(v.receita);
      const ls = tudo.filter(f => todos || resumoLote(f).rest > 0 || String(f.id) === String(sel));
      const fechados = tudo.length - ls.length;
      div.innerHTML = `<h2>De qual lote saiu esta venda?</h2>
        <p class="muted" style="margin:0 0 14px;font-size:14px">${esc(v.receita)} · ${num(q('#v_qtd').value)} ${num(q('#v_qtd').value) === 1 ? 'unidade' : 'unidades'}</p>
        ${ls.map((f, i) => { const r = resumoLote(f);
          const tag = ls.length > 1 ? (i === 0 ? '<span class="badge b-ok">mais recente</span>' : i === ls.length - 1 ? '<span class="badge b-warn">mais antigo</span>' : '') : '';
          return `<button type="button" class="lote-op ${String(f.id) === String(sel) && loteOk ? 'on' : ''}" data-pl="${esc(f.id)}"><span><b>${nomeLote(f)} · feito em ${dataBR(f.data)}</b>
            <small>${r.rest} ${r.rest === 1 ? 'unidade restante' : 'unidades restantes'} · custo ${brl(r.cu)} por unidade</small></span>${tag}</button>`; }).join('')}
        ${!todos && fechados ? `<button type="button" class="btn" data-todos style="width:100%;margin-bottom:8px">Mostrar ${fechados === 1 ? '1 lote encerrado' : fechados + ' lotes encerrados'}</button>` : ''}
        <button type="button" class="lote-op ${!sel && loteOk ? 'on' : ''}" data-pl=""><span><b>Sem lote</b><small>Usa o preço atual dos ingredientes</small></span></button>
        <div style="margin-top:auto;padding-top:12px"><button type="button" class="btn" data-pvoltar style="width:100%">Voltar</button></div>`;
    };
    desenhar();
    div.onclick = e => {
      if (e.target.closest('[data-todos]')){ todos = true; desenhar(); return; }
      if (e.target.closest('[data-pvoltar]')){ div.remove(); return; }
      const b = e.target.closest('[data-pl]'); if (!b) return;
      setLote(b.dataset.pl, true); div.remove(); if (depois) depois();
    };
  };
  if (id) q('#v_lote').value = v.lote || '';
  if (id) desenharLoteBtn(); else iniciarLote();
  q('#v_lotebtn').onclick = () => abrirPicker();
  const auto = () => { if (valorManual) return; const a = valorAuto(v.receita, num(q('#v_qtd').value)); if (a){ q('#v_valor').value = a.valor; q('#v_combo').value = a.combo; } prev(); };
  const desenharPrecos = () => {
    const ps = precosDe(v.receita);
    q('#v_precos').innerHTML = ps.length ? ps.map(p => `<button type="button" class="chip" data-p="${esc(p.id)}">${esc(p.descricao)} · ${brl(p.preco)}</button>`).join('')
      : `<span class="muted" style="font-size:13px">Sem preços cadastrados para esta receita. <a href="#cad/Precos">Cadastrar</a></span>`;
  };
  const desenharStatus = () => { q('#v_status').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.st === st)); q('#v_pago').style.display = st === 'Pago' ? '' : 'none'; };
  desenharPrecos(); desenharStatus(); if (!id) auto(); else prev();

  q('#v_rec').onclick = e => { const b = e.target.closest('[data-rec]'); if (!b) return; v.receita = b.dataset.rec;
    q('#v_rec').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); desenharPrecos(); iniciarLote(); valorManual = false; auto(); };
  q('#v_precos').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; const p = S.Precos.find(x => String(x.id) === b.dataset.p);
    q('#v_qtd').value = num(p.quantidade); q('#v_valor').value = num(p.preco); q('#v_combo').value = p.descricao; valorManual = false; prev(); };
  m.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { q('#v_qtd').value = Math.max(1, num(q('#v_qtd').value) + num(b.dataset.q)); valorManual = false; auto(); });
  q('#v_qtd').oninput = () => { valorManual = false; auto(); };
  q('#v_valor').oninput = () => { valorManual = true; q('#v_combo').value = ''; prev(); };
  ['#v_local','#v_rend'].forEach(s => q(s).oninput = prev);
  q('#v_cliente').onchange = () => { const c = S.Clientes.find(x => x.nome === q('#v_cliente').value.trim()); if (c && c.local_padrao && !q('#v_local').value){ q('#v_local').value = c.local_padrao; prev(); } };
  q('#v_status').onclick = e => { const b = e.target.closest('[data-st]'); if (b){ st = b.dataset.st; desenharStatus(); } };

  m.onSalvar = async () => {
    const d = lerV();
    if (!d.cliente) throw new Error('Informe o nome do cliente.');
    if (!(d.quantidade > 0)) throw new Error('Informe a quantidade.');
    if (!(d.valor >= 0)) throw new Error('Informe o valor.');
    if (!loteOk){ abrirPicker(() => m.querySelector('[data-ok]').click()); const e = new Error('Escolha o lote'); e.silencioso = true; throw e; }
    Object.assign(d, calcVenda(d));
    await salvar('Vendas', d, id);
    if (!S.Clientes.some(c => c.nome.toLowerCase() === d.cliente.toLowerCase())){
      salvar('Clientes', {nome:d.cliente, local_padrao:d.local}).catch(() => {});
    }
    toast(id ? 'Venda atualizada' : 'Venda salva');
  };
  m.onExcluir = async () => { await excluir('Vendas', id); toast('Venda excluída'); };
}

/* ============ TELA: A RECEBER ============ */
function telaReceber(){
  const pend = S.Vendas.filter(v => v.status !== 'Pago');
  const grupos = {};
  pend.forEach(v => (grupos[v.cliente || 'Sem nome'] ||= []).push(v));
  const nomes = Object.keys(grupos).sort((a,b) => soma(grupos[b],'valor') - soma(grupos[a],'valor'));
  return `<div class="head"><div><h1>A receber</h1><p class="sub">${brl(soma(pend,'valor'))} de ${nomes.length} ${nomes.length === 1 ? 'cliente' : 'clientes'}, considerando todos os meses</p></div></div>
  <section class="panel">${nomes.length ? nomes.map(n => {
    const vs = grupos[n]; const tot = soma(vs,'valor'); const cli = S.Clientes.find(c => c.nome === n);
    const fone = cli && String(cli.telefone || '').replace(/\D/g,'');
    return `<div class="grupo"><div class="grupo-top"><b>${esc(n)}</b><b class="num">${brl(tot)}</b></div>
      <div class="muted" style="font-size:13px;margin-top:4px">${vs.map(v => `${dataBR(v.data)}: ${num(v.quantidade)} ${esc(v.receita)} (${brl(v.valor)})`).join(' · ')}</div>
      <div class="acoes"><button class="btn" data-pagar="${esc(n)}" data-forma="Pix">Recebi no Pix</button><button class="btn" data-pagar="${esc(n)}" data-forma="Dinheiro">Recebi em dinheiro</button>
      ${fone ? `<a class="btn zap" target="_blank" rel="noopener" href="https://wa.me/${fone.length <= 11 ? '55' + fone : fone}?text=${encodeURIComponent(msgCobranca(n, tot))}">${I.zap} Cobrar</a>` : `<a class="btn" href="#cad/Clientes">Adicionar telefone</a>`}</div></div>`;
  }).join('') : `<div class="vazio"><b>Nada pendente</b>Todas as vendas registradas estão pagas.</div>`}</section>`;
}
function msgCobranca(nome, valor){
  const t = S.config.mensagem_cobranca || 'Oi, {nome}! Tudo bem? Passando para lembrar do pagamento da palha italiana: {valor}. Pode ser no Pix. Obrigado!';
  return t.replace(/\{nome\}/g, nome.split(' ')[0]).replace(/\{valor\}/g, brl(valor));
}

/* ============ TELA: REPASSES ============ */
function telaRepasses(){
  const locs = S.Locais.filter(l => pct(l.repasse_percentual) > 0);
  if (!locs.length) return `<div class="head"><div><h1>Repasses</h1></div></div><section class="panel vazio"><b>Nenhum local com repasse</b>Cadastre o local e o percentual (por exemplo, Núcleo com 20%).<div style="margin-top:14px"><a class="btn pri" href="#cad/Locais">Abrir locais</a></div></section>`;
  const cards = locs.map(l => {
    const devido = soma(S.Vendas.filter(v => v.local === l.nome),'repasse');
    const feito = soma(S.Repasses.filter(r => r.local === l.nome),'valor');
    const doMes = soma(vendasMes().filter(v => v.local === l.nome),'repasse');
    const saldo = r2(devido - feito);
    return `<section class="panel"><div class="grupo-top"><h2 style="margin:0">${esc(l.nome)}</h2><span class="badge ${saldo > 0 ? 'b-warn' : 'b-ok'}">${saldo > 0 ? 'Saldo em aberto' : 'Em dia'}</span></div>
      <table style="margin-top:10px"><tbody>
        <tr><td>Repasse de ${nomeMes(S.mes)} (${Math.round(pct(l.repasse_percentual)*100)}%)</td><td class="r num">${brl(doMes)}</td></tr>
        <tr><td>Total devido, todos os meses</td><td class="r num">${brl(devido)}</td></tr>
        <tr><td>Já repassado</td><td class="r num">${brl(feito)}</td></tr>
        <tr><td><b>Saldo a repassar</b></td><td class="r num"><b>${brl(saldo)}</b></td></tr></tbody></table>
      <div class="acoes"><button class="btn pri" data-repassar="${esc(l.nome)}" data-saldo="${Math.max(saldo,0)}">Registrar repasse</button></div></section>`;
  }).join('');
  const hist = [...S.Repasses].sort((a,b) => String(b.data).localeCompare(String(a.data)));
  return `<div class="head"><div><h1>Repasses</h1><p class="sub">Valores devidos aos locais de venda</p></div>${seletorMes()}</div>
  <div class="grid g2">${cards}</div>
  <section class="panel" style="margin-top:14px"><h2>Histórico</h2>${hist.length ? `<div class="lista">${hist.map(r => `<button class="item" data-edit="Repasses" data-id="${esc(r.id)}"><div class="t"><b>${esc(r.local)}</b><small>${dataBR(r.data)}${r.observacao ? ' · ' + esc(r.observacao) : ''}</small></div><div class="v"><b class="num">${brl(r.valor)}</b></div></button>`).join('')}</div>` : `<p class="muted" style="margin:0">Nenhum repasse registrado.</p>`}</section>`;
}

{id:'como-calcula', g:'Primeiros passos', t:'Como o app calcula cada venda', r:'De onde vêm o custo, o repasse, a reserva e o lucro.',
 tags:'calculo conta formula entender numeros divisao', rel:['custo-preparo','repasse','reserva','lucro-disponivel'], c:`
<p>Ao salvar uma venda, o app divide o valor em quatro partes e grava cada uma junto com a venda:</p>
<p><b>Valor da venda − custo de preparo − repasse − reserva = lucro disponível</b></p>
<h3>Exemplo: combo 3 por R$ 18 no Núcleo</h3>

<ul>

<li>Reserva da empresa (igual ao custo): <b>R$ 6,60</b></li>

</ul>
<h3>Exemplo: 1 unidade avulsa por R$ 7 no Detran</h3>
<ul>
<li>Custo: R$ 2,20 · Repasse: R$ 0 · Reserva: R$ 2,20</li>

<h3>Os valores ficam gravados</h3>
<p>O custo, o repasse, a reserva e o lucro são gravados no momento da venda. Se o preço de um ingrediente subir depois, as vendas antigas não mudam. Elas só são recalculadas quando você edita a venda ou o lote dela.</p>`},

<h3>Botão Estoque</h3>
<p>Abre as compras daquele ingrediente: a que está em uso, as que estão na fila e as que já acabaram. Veja <a href="#ajuda/estoque-ingredientes">Estoque de ingredientes</a>.</p>`},

{id:'tela-receitas', g:'Telas', t:'Receitas e composição', r:'Rendimento de cada receita e os ingredientes de uma forma.',
 tags:'sabor tradicional ninho nutella rendimento composicao forma', tela:'#cad/Receitas', rel:['tela-ingredientes','custo-preparo','tela-precos'], c:`
<p>Cada receita é um sabor (ex.: Tradicional, Ninho com Nutella).</p>
<h3>Campos da receita</h3>
<ul>
<li><b>Nome</b>: aparece nos botões da venda.</li>
<li><b>Rendimento padrão</b>: quantas unidades uma forma costuma render. É usado quando a venda não tem lote.</li>
<li><b>Ativa</b>: “Não” tira a receita dos botões de venda sem apagar o histórico.</li>
</ul>
<h3>Composição (botão Ingredientes)</h3>
<p>Na lista de receitas, toque em <b>Ingredientes</b> para montar o que vai em <b>uma forma</b>. Informe a quantidade na mesma unidade do ingrediente (ex.: 790 g de leite condensado = 2 latas).</p>
<p>Ao lado, o quadro <b>Custo</b> mostra o custo da forma, os custos adicionais e o custo por unidade.</p>
<h3>Renomear uma receita</h3>
<p>Evite renomear receitas que já têm vendas, porque as vendas e os lotes guardam o nome. Se precisar de outra versão, crie uma receita nova e desative a antiga.</p>`},

{id:'tela-precos', g:'Telas', t:'Preços e combos', r:'Preço avulso e combos de cada receita.',
 tags:'preco valor combo promocao avulso tabela', tela:'#cad/Precos', rel:['registrar-combo','margem-ticket'], c:`
<p>Cada linha é uma forma de vender uma receita.</p>
<h3>Campos</h3>
<ul>
<li><b>Receita</b>: o sabor.</li>
<li><b>Descrição</b>: ex.: Avulso, Combo 2, Combo 3.</li>
<li><b>Quantidade de unidades</b>: 1 para avulso, 3 para combo de 3, e assim por diante.</li>
<li><b>Preço</b>: o valor total (ex.: Combo 3 por R$ 18).</li>
<li><b>Ativo</b>: “Não” desliga uma promoção sem apagar.</li>
</ul>
<h3>Por que cadastrar o avulso</h3>
<p>O preço avulso (1 unidade) é a referência do Painel para calcular quanto os combos deram de desconto. Sem ele, o bloco “Avulso x combo” não aparece.</p>`},

{id:'tela-custos-adicionais', g:'Telas', t:'Custos adicionais', r:'Saquinho, etiqueta, sacola e outros custos além dos ingredientes.',
 tags:'embalagem saquinho etiqueta sacola caixinha adicional', tela:'#cad/CustosAdicionais', rel:['custo-preparo','tela-receitas'], c:`
<p>Custos que não são ingredientes, mas entram no custo da venda.</p>
<h3>Campos</h3>
<ul>
<li><b>Item</b>: ex.: saquinho, etiqueta, sacola.</li>
<li><b>Preço do pacote</b> e <b>Quantidade no pacote</b>: o app calcula o custo de cada um.</li>
<li><b>Aplicar</b>: <b>Por unidade</b> (ex.: um saquinho por palha), <b>Por pedido</b> (ex.: uma sacola por venda) ou <b>Por fornada</b> (ex.: papel-manteiga de uma forma).</li>
<li><b>Ativo</b>: o custo só entra nas contas quando está “Sim”.</li>
</ul>
<p>Ative um item só quando começar a usá-lo de verdade. As vendas já salvas não mudam.</p>`},

{id:'tela-locais', g:'Telas', t:'Locais de venda', r:'Onde você vende e o percentual de repasse de cada lugar.',
 tags:'nucleo detran outros local repasse porcentagem', tela:'#cad/Locais', rel:['repasse','tela-repasses'], c:`
<h3>Campos</h3>
<ul>
<li><b>Nome</b>: ex.: Núcleo, Detran, Outros.</li>
<li><b>Repasse (%)</b>: quanto do valor vendido vai para o local. Ex.: 20 para o Núcleo. Use 0 quando não há repasse.</li>
<li><b>Observação</b>: opcional.</li>
</ul>
<p>Locais com repasse maior que zero aparecem na tela <a href="#ajuda/tela-repasses">Repasses</a>.</p>`},

{id:'tela-clientes', g:'Telas', t:'Clientes', r:'Nome, WhatsApp e local habitual de cada cliente.',
 tags:'cliente telefone whatsapp contato cadastro', tela:'#cad/Clientes', rel:['cobrar-whatsapp','tela-receber'], c:`
<p>Cliente novo é cadastrado sozinho quando você registra uma venda com um nome que ainda não existe.</p>
<h3>Campos</h3>
<ul>
<li><b>Nome</b>: igual ao usado nas vendas.</li>
<li><b>Telefone (WhatsApp)</b>: com DDD, ex.: 11 98888-7777. Sem ele, os botões Cobrar e Chamar não aparecem.</li>
<li><b>Local habitual</b>: preenche o local sozinho nas próximas vendas desse cliente.</li>
<li><b>Observação</b>: opcional.</li>
</ul>
<h3>Mesmo cliente com nomes diferentes</h3>
<p>“Cris” e “Cristina” viram dois clientes. Para juntar, edite as vendas e use um único nome.</p>`},

{id:'tela-compras', g:'Telas', t:'Compras', r:'Registro do que foi gasto no mercado. Cada compra entra no estoque.',
 tags:'compra mercado gasto despesa atacadao assai nota', tela:'#cad/Compras', rel:['registrar-compra','estoque-ingredientes','compra-depois-fornada'], c:`
<p>Mostra as compras do mês escolhido. Elas alimentam o estoque de ingredientes, o Caixa da empresa e os Gastos do mês no Painel.</p>
<h3>Campos</h3>
<ul>
<li><b>Data</b> e <b>Mercado</b>.</li>
<li><b>Item</b>: use o mesmo nome do ingrediente para a compra entrar no estoque dele.</li>
<li><b>Quantidade</b> e <b>Unidade</b>: quantos potes ou latas (un) ou o peso total (g ou kg). Sem quantidade, a compra não entra no estoque.</li>
<li><b>Valor pago</b>: o total da compra daquele item.</li>
<li><b>Tipo</b>: Ingrediente, Embalagem, Investimento (forma, cortador, equipamentos) ou Outro. Só o tipo Ingrediente entra no estoque.</li>
<li><b>Usada em fornadas já registradas</b>: aparece para ingredientes. Marque os lotes que já usaram esta compra. Veja <a href="#ajuda/compra-depois-fornada">Compra registrada depois da fornada</a>.</li>
<li><b>Observação</b>: opcional.</li>
</ul>`},

{id:'tela-config', g:'Telas', t:'Configurações', r:'Reserva, meta, mensagens do WhatsApp e alerta de lote antigo.',
 tags:'configuracao ajuste regra meta mensagem alerta', tela:'#config', rel:['reserva','cobrar-whatsapp'], c:`
<h3>Campos</h3>
<ul>
<li><b>Nome do negócio</b>.</li>
<li><b>Regra da reserva</b>: <b>Igual ao custo</b> (separa de reserva o mesmo valor do custo) ou <b>Percentual da venda</b> (ex.: 10% de cada venda). Veja <a href="#ajuda/reserva">Reserva</a>.</li>
<li><b>Rendimento padrão</b>: usado quando a receita não tem rendimento próprio.</li>
<li><b>Meta de lucro mensal</b>: aparece no Painel com o progresso e a projeção.</li>
<li><b>Mensagem de cobrança</b>: texto do botão Cobrar. Use {nome} e {valor}.</li>
<li><b>Mensagem para clientes sumidos</b>: texto do botão Chamar no Painel. Use {nome}.</li>
<li><b>Alerta de lote antigo</b>: depois de quantos dias da fornada o Painel avisa (padrão 7).</li>
</ul>
<p>Mudar a regra da reserva vale para as próximas vendas. As já salvas mantêm os valores.</p>`},

/* ---------------- CONCEITOS ---------------- */
{id:'custo-preparo', g:'Conceitos', t:'Custo de preparo', r:'Quanto custou produzir as unidades vendidas.',
 tags:'custo gasto ingrediente preparo unidade', rel:['como-calcula','tela-receitas','lote'], c:`
<p>É o custo dos ingredientes das unidades vendidas, mais os custos adicionais ativos.</p>
<h3>Como é calculado</h3>
<ul>
<li><b>Venda com lote</b>: usa o custo por unidade gravado no lote, no dia da fornada.</li>
<li><b>Venda sem lote</b>: usa os preços atuais dos ingredientes ÷ o rendimento da forma.</li>
</ul>
<p>Depois soma os custos adicionais ativos: por unidade, por pedido e por fornada.</p>
<p>Exemplo: forma com custo de R$ 35,20 que rende 16 unidades = R$ 2,20 por unidade.</p>`},

{id:'repasse', g:'Conceitos', t:'Repasse', r:'A parte do valor vendido que vai para o local de venda.',
 tags:'repasse nucleo comissao porcentagem 20', rel:['tela-repasses','tela-locais'], c:`
<p>É o percentual do local aplicado sobre o <b>valor da venda</b>. Ex.: venda de R$ 18 no Núcleo, com 20% = R$ 3,60 de repasse.</p>
<p>O repasse é gravado na venda. A tela <a href="#ajuda/tela-repasses">Repasses</a> soma o devido e controla o que já foi repassado.</p>
<h3>Venda sem local</h3>
<p>Se o campo Local ficar vazio, não há repasse. Confira o local nas vendas feitas no Núcleo.</p>`},

{id:'reserva', g:'Conceitos', t:'Reserva da empresa', r:'O dinheiro separado para reposição e investimentos.',
 tags:'reserva caixa guardar separar investimento poupanca', rel:['caixa-empresa','tela-config','lucro-disponivel'], c:`
<p>Além de repor os ingredientes, cada venda separa uma reserva para a empresa: dinheiro para imprevistos, reposição e investimentos.</p>
<h3>Regras disponíveis</h3>
<ul>
<li><b>Igual ao custo</b> (padrão): a reserva é o mesmo valor do custo de preparo. Se a venda custou R$ 6,60, separa mais R$ 6,60.</li>
<li><b>Percentual da venda</b>: separa um percentual fixo do valor vendido.</li>
</ul>
<p>A regra é escolhida em <a href="#ajuda/tela-config">Configurações</a>. O saldo acumulado aparece no <a href="#ajuda/caixa-empresa">Caixa da empresa</a>.</p>`},

{id:'lucro-disponivel', g:'Conceitos', t:'Lucro disponível', r:'O que sobra de verdade depois de tudo separado.',
 tags:'lucro ganho sobra liquido retirar', rel:['como-calcula','reserva','prob-lucro-negativo'], c:`
<p>É o valor da venda menos o custo de preparo, o repasse e a reserva. É o dinheiro que pode ser retirado sem prejudicar o negócio.</p>
<h3>Quando ele fica baixo</h3>
<p>Combos com desconto, repasse e a reserva igual ao custo reduzem bastante o lucro por unidade. O Painel ajuda a ver isso nos blocos “Por local” e “Avulso x combo”.</p>`},

{id:'lote', g:'Conceitos', t:'Lote', r:'Cada fornada, com o custo gravado no dia em que foi feita.',
 tags:'lote fornada forma producao estoque', rel:['registrar-fornada','tela-lotes','trocar-lote'], c:`
<p>Um lote é uma fornada. Quando você registra a fornada, o app grava o custo com o preço da compra usada de cada ingrediente e calcula o custo por unidade.</p>
<h3>Por que isso importa</h3>
<p>Os preços mudam a cada compra. Com lotes, a venda de hoje de uma fornada da semana passada usa o custo da semana passada. Assim, dá para ver o lucro real de cada fornada.</p>
<h3>Ligação com as vendas</h3>
<p>Cada venda é ligada a um lote. Se há mais de um lote com unidades sobrando, o app pergunta de qual saiu. Veja <a href="#ajuda/trocar-lote">Escolher ou trocar o lote</a>.</p>`},

{id:'caixa-empresa', g:'Conceitos', t:'Caixa da empresa', r:'Quanto dinheiro existe para repor ingredientes e investir.',
 tags:'caixa saldo dinheiro reserva reposicao conta', tela:'#inicio', rel:['reserva','registrar-compra'], c:`
<p>Aparece no Painel e soma, até o fim do mês escolhido:</p>
<p><b>separado para repor ingredientes + reserva da empresa − compras = saldo em caixa</b></p>
<h3>Só vendas recebidas</h3>
<p>Entram só as vendas já pagas, porque o dinheiro das pendentes ainda não chegou. O bloco avisa quanto entra quando os pendentes pagarem.</p>
<h3>Saldo negativo</h3>
<p>Significa que as compras passaram do valor separado, e a diferença saiu do lucro ou do seu bolso. Pode acontecer no começo, quando as compras vêm antes das vendas.</p>`},

{id:'margem-ticket', g:'Conceitos', t:'Margem, ticket médio e preço médio', r:'Três números para entender o desempenho das vendas.',
 tags:'margem ticket media preco medio percentual', rel:['tela-painel','registrar-combo'], c:`
<h3>Margem de lucro</h3>
<p>Lucro disponível ÷ vendido. Margem de 20% significa que R$ 0,20 de cada R$ 1 vendido viram lucro.</p>
<h3>Ticket médio</h3>
<p>Vendido ÷ número de vendas. Mostra quanto cada cliente gasta, em média, por compra. Combos costumam aumentar o ticket.</p>
<h3>Preço médio por unidade</h3>
<p>Vendido ÷ unidades. Se o avulso é R$ 7 e o preço médio é R$ 6,40, os combos estão puxando o preço para baixo.</p>`},

{id:'registrar-combo', g:'Como fazer', t:'Registrar uma venda em combo', r:'Como lançar 3 por R$ 18 e quantidades misturadas.',
 tags:'combo promocao 3 por 18 desconto kit', tela:'#vendas', rel:['tela-precos','registrar-venda'], c:`
<ol>
<li>Abra uma nova venda.</li>
<li>Em <b>Preço / combo</b>, toque em “Combo 3 · R$ 18”. A quantidade e o valor são preenchidos.</li>
<li>Complete cliente, local e pagamento, e salve.</li>
</ol>
<h3>Quantidades misturadas</h3>
<p>Se a pessoa levar 4 unidades, use o + até 4. O app monta sozinho “Combo 3 + Avulso” = R$ 25.</p>
<h3>Preço combinado na hora</h3>
<p>Se você deu um desconto diferente, digite o valor no campo <b>Valor</b>. O app mantém o que você digitou.</p>`},

/* ---------------- COMO FAZER ---------------- */
{id:'registrar-venda', g:'Como fazer', t:'Registrar uma venda', r:'Passo a passo para lançar uma venda.',
 tags:'nova venda lancar vender pedido registrar', tela:'#vendas', rel:['tela-vendas','registrar-combo','baixa-pagamento'], c:`
<ol>
<li>Toque no <b>+</b> no canto superior direito (celular) ou em <b>Nova venda</b> (computador).</li>
<li>Confira a <b>Data</b>. Ela vem com hoje; mude se a venda foi em outro dia.</li>
<li>Digite o <b>Cliente</b> e escolha a <b>Receita</b>.</li>
<li>Toque no preço ou combo, ou ajuste a <b>Quantidade</b>.</li>
<li>Escolha o <b>Local</b> (define o repasse).</li>
<li>Marque <b>Pendente</b> ou <b>Pago</b>.</li>
<li>Toque em <b>Salvar venda</b>. Se houver mais de um lote com unidades, o app pergunta de qual saiu.</li>
</ol>
<h3>Venda de outro dia</h3>
<p>No celular, depois de escolher a data no calendário, confira se ela ficou certa no campo antes de salvar.</p>`},

{id:'baixa-pagamento', g:'Como fazer', t:'Dar baixa num pagamento', r:'Marcar como paga uma ou todas as vendas de um cliente.',
 tags:'baixa pagou recebi quitou pix dinheiro pago cliente pagou uma venda individual parcial', tela:'#receber', rel:['tela-receber','cobrar-whatsapp'], c:`
<h3>Todas as vendas do cliente</h3>
<p>Em <b>A receber</b>, toque em <b>Recebi no Pix</b> ou <b>Recebi em dinheiro</b> no cliente. Todas as pendentes dele ficam pagas, com a data de hoje.</p>
<h3>Só uma venda</h3>
<ol>
<li>Vá em <b>Vendas</b> e filtre por <b>Pendentes</b> (mude o mês se a venda for antiga).</li>
<li>Toque na venda, marque <b>Pago</b>, escolha a forma e a data do pagamento.</li>
<li>Salve.</li>
</ol>
<h3>Pagamento parcial</h3>
<p>O app não divide uma venda em partes. Se o cliente pagou uma parte, deixe a venda como pendente e anote o valor recebido em Observação até ele quitar.</p>`},

{id:'cobrar-whatsapp', g:'Como fazer', t:'Cobrar pelo WhatsApp', r:'Enviar a mensagem de cobrança pronta com o valor devido.',
 tags:'cobrar cobranca whatsapp zap mensagem lembrar', tela:'#receber', rel:['tela-clientes','tela-config'], c:`
<ol>
<li>Cadastre o telefone do cliente em <a href="#cad/Clientes">Clientes</a>, com DDD.</li>
<li>Em <b>A receber</b>, toque em <b>Cobrar</b> no cliente.</li>
<li>O WhatsApp abre com a mensagem e o valor total. Revise e envie.</li>
</ol>
<h3>Mudar o texto</h3>
<p>Edite a mensagem em <a href="#ajuda/tela-config">Configurações</a>. {nome} vira o primeiro nome do cliente e {valor} vira o total devido.</p>
<h3>Clientes sumidos</h3>
<p>No Painel, o bloco “Clientes sumidos” tem o botão <b>Chamar</b>, com uma mensagem de oferta que também pode ser editada nas Configurações.</p>`},

{id:'registrar-fornada', g:'Como fazer', t:'Registrar uma fornada (lote)', r:'Lançar cada forma produzida, com rendimento, perdas e as compras usadas.',
 tags:'fornada forma fiz produzi lote producao perda rendimento ingrediente compra usada', tela:'#lotes', rel:['lote','estoque-ingredientes','tela-lotes'], c:`
<ol>
<li>Vá em <b>Mais → Lotes e fornadas</b> e toque em <b>Nova fornada</b>.</li>
<li>Confira a <b>Data</b> e escolha a <b>Receita</b>.</li>
<li>Informe as <b>Unidades produzidas</b> (quantos pedaços saíram) e as <b>Perdas</b>, se houver.</li>
<li>Confira os <b>Ingredientes desta fornada</b>: cada um já vem com a compra em uso marcada.</li>
<li>Salve. O app cria o lote com o custo das compras marcadas e desconta do estoque o que a forma usou.</li>
</ol>
<h3>Ingredientes desta fornada</h3>
<p>Cada ingrediente mostra a quantidade usada, o custo e qual compra está sendo usada. Se esta fornada usou outra compra (por exemplo, a Nutella mais antiga), troque no seletor. A opção “Sem compra” usa o último preço do cadastro e não desconta do estoque.</p>
<h3>Quando uma compra acaba</h3>
<p>Se a fornada consumir o que restava de uma compra, o app avisa e a próxima da fila passa a ser usada nas próximas fornadas. Se a forma usou o fim de um pote e o começo de outro, vale o preço da compra marcada.</p>
<h3>Registrar perdas depois</h3>
<p>Se um pedaço estragar dias depois, abra o lote em <b>Editar lote</b> e aumente as perdas. O custo do lote não muda.</p>
<h3>Mudar o rendimento ou as compras depois</h3>
<p>Ao corrigir as unidades produzidas ou trocar a compra de um ingrediente, o custo do lote é recalculado e as vendas daquele lote são atualizadas sozinhas.</p>`},

{id:'registrar-compra', g:'Como fazer', t:'Registrar uma compra', r:'Lançar a ida ao mercado. A compra entra no estoque do ingrediente.',
 tags:'compra comprar mercado preco atualizar nota gasto forma cortador equipamento investimento nova', tela:'#cad/Compras', rel:['estoque-ingredientes','compra-depois-fornada','tela-compras'], c:`
<ol>
<li>Vá em <b>Mais → Compras</b> e toque em <b>Adicionar</b>. Ou, em Ingredientes, abra o <b>Estoque</b> do ingrediente e toque em <b>Registrar compra</b>.</li>
<li>Preencha data, mercado e o <b>Item</b> com o mesmo nome do ingrediente.</li>
<li>Em <b>Quantidade</b> e <b>Unidade</b>, informe quantas embalagens (un) ou o peso total (g ou kg).</li>
<li>Informe o <b>Valor pago</b> total e o <b>Tipo</b>.</li>
<li>Salve. O app avisa se a compra ficou <b>em uso</b> ou <b>na fila</b>.</li>
</ol>
<h3>Em uso ou na fila</h3>
<p>Se ainda há uma compra anterior do ingrediente em uso, a nova entra <b>na fila</b> e as fornadas continuam usando o preço da anterior. Quando a anterior acaba, a nova passa a ser usada sozinha. Exemplo: com a Nutella de 26/09 ainda em uso, a compra do dia 12 fica na fila, e a fornada do dia 15 usa o preço de 26/09.</p>
<h3>Exemplos de quantidade</h3>
<ul>
<li>2 potes de Nutella de 650 g por R$ 90 → Quantidade 2, Unidade un.</li>
<li>10 latas de leite condensado → Quantidade 10, Unidade un.</li>
<li>3,95 kg de leite condensado a granel → Quantidade 3.95, Unidade kg.</li>
</ul>
<h3>Quando a compra não entra no estoque</h3>
<ul>
<li>O item não tem o mesmo nome de um ingrediente cadastrado.</li>
<li>A quantidade ficou vazia.</li>
<li>A unidade não combina (ex.: ml para um ingrediente em g).</li>
<li>O tipo não é Ingrediente.</li>
</ul>
<h3>Forma, cortador e equipamentos</h3>
<p>Use o tipo <b>Investimento</b>. Eles aparecem no bloco “Retorno do investimento” do Painel.</p>`},

{id:'trocar-lote', g:'Como fazer', t:'Escolher ou trocar o lote de uma venda', r:'Indicar de qual fornada saiu o produto vendido.',
 tags:'lote escolher trocar mudar venda fornada antigo', tela:'#vendas', rel:['lote','registrar-venda'], c:`
<h3>Na hora da venda</h3>
<ul>
<li>Com <b>um</b> lote com unidades sobrando, o app usa esse lote sozinho.</li>
<li>Com <b>dois ou mais</b>, ao salvar abre a janela “De qual lote saiu esta venda?”. Toque no lote e a venda é salva.</li>
<li>O campo <b>Lote</b> fica laranja enquanto não foi confirmado. Toque nele para escolher antes de salvar.</li>
</ul>
<h3>Lote que aparece como encerrado</h3>
<p>Na janela, toque em <b>Mostrar lotes encerrados</b> para escolher um lote que o app considera esgotado.</p>
<h3>Trocar depois</h3>
<p>Abra a venda em Vendas, toque no campo Lote, escolha outro e salve. O custo e o lucro são recalculados.</p>`},

{id:'organizar-antigos', g:'Como fazer', t:'Organizar registros antigos', r:'Ligar vendas e fornadas de antes da função de lotes.',
 tags:'antigo organizar ligar vincular registros anteriores lote sem lote', tela:'#lotes', rel:['prob-lote-zerado','lote'], c:`
<p>Vendas e fornadas registradas antes da função de lotes ficam sem ligação. A tela Lotes mostra o aviso “Registros de antes dos lotes”.</p>
<ol>
<li>Toque em <b>Organizar agora</b>.</li>
<li>Confira a prévia: fornadas que vão receber número e custo, e quantas vendas vão para cada lote.</li>
<li>Deixe marcada a opção de recalcular custo, reserva e lucro, e toque em <b>Organizar</b>.</li>
</ol>
<h3>Como as vendas são distribuídas</h3>

{id:'estoque-ingredientes', g:'Conceitos', t:'Estoque de ingredientes', r:'Compra em uso, na fila e acabada: qual preço entra em cada fornada.',

  ['fiado','pendente','pendentes','devendo','deve','devem','divida','debito','calote','atrasado','atraso','receber','inadimplente'],

  ['fila','proxima','nova','guardada'],
  ['antiga','anterior','velha','passada'],
];
const KB_SUGESTOES = ['Como registro um combo?', 'Por que o lucro do lote está negativo?', 'Como cobro pelo WhatsApp?',
  'O que é a reserva da empresa?', 'Comprei Nutella mas ainda tenho a antiga', 'Esqueci de registrar a compra antes da fornada'];

/* ============ BUSCA NA BASE DE CONHECIMENTO ============ */
const KB_STOP = new Set(('a o as os e de da do das dos um uma uns umas que como eu meu minha meus minhas me mim para pra pro pros pras pelo pela pelos pelas por ' +
  'no na nos nas num numa em se ser sou foi era ta esta estao estou isso esse essa este esses essas ele ela eles elas qual quais onde quando porque pq ' +
  'com ao aos ja la aqui ai so tem ter tenho tinha vai vou faco faz fazer posso pode podemos consigo consegue preciso precisa quero queria gostaria saber ' +
  'sobre algum alguma alguns nao sim muito oi ola app aplicativo coisa isto dele dela tambem mesmo voce vc ou mas entao agora hoje').split(' '));
const KB_SUF = ['amentos','imentos','amento','imento','acoes','icoes','ancas','encas','mente','acao','icao','anca','enca','ados','idos','adas','idas',
  'ando','endo','indo','aram','eram','iram','avam','ado','ido','ada','ida','ar','er','ir','ou','eu','as','es','os','is','a','e','o','i','s'];
const kbNorm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function kbStem(w){ if (/^\d+$/.test(w) || w.length <= 3) return w; for (const s of KB_SUF) if (w.endsWith(s) && w.length - s.length >= 3) return w.slice(0, -s.length); return w; }
const KB_GRUPO = {}; KB_SIN.forEach((ws, i) => ws.forEach(w => { KB_GRUPO[kbStem(kbNorm(w))] = 'g' + i; }));
function kbTokens(s){ return kbNorm(s).split(' ').filter(w => w && !KB_STOP.has(w)).map(kbStem); }
const kbTexto = html => String(html).replace(/<\/?(b|strong|a|i|em|mark|span)(\s[^>]*)?>/g, '').replace(/<\/li>/g, '. ')
  .replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').replace(/([.:;!?])\s*\.(\s|$)/g, '$1$2').replace(/\s+([.,:;])/g, '$1').trim();

let KB_IDX = null;
function kbIndice(){
  if (KB_IDX) return KB_IDX;
  const trechos = [], df = {}, vocab = new Set();
  KB.forEach(a => {
    const partes = a.c.split(/<h3>/);
    partes.forEach((p, i) => {
      let titulo = a.t, corpo = p;
      if (i > 0){ const k = p.indexOf('</h3>'); titulo = p.slice(0, k); corpo = p.slice(k + 5); }
      const texto = kbTexto(corpo); if (!texto) return;
      const tf = {}; const add = (t, w) => { tf[t] = (tf[t] || 0) + w; };
      kbTokens(texto).forEach(t => { add(t, 1); if (KB_GRUPO[t]) add(KB_GRUPO[t], .6); });
      const extra = {}; const addX = (s, w) => kbTokens(s).forEach(t => { extra[t] = Math.max(extra[t] || 0, w); if (KB_GRUPO[t]) extra[KB_GRUPO[t]] = Math.max(extra[KB_GRUPO[t]] || 0, w * .6); });
      addX(a.t, 2.2); addX(a.tags, 1.4); if (i > 0) addX(titulo, 1.6);
      Object.keys({...tf, ...extra}).forEach(t => { df[t] = (df[t] || 0) + 1; if (t[0] !== 'g' || !/^g\d+$/.test(t)) vocab.add(t); });
      trechos.push({a, titulo: i > 0 ? kbTexto(titulo) : '', texto, tf, extra});
    });
  });
  KB_IDX = {trechos, df, vocab:[...vocab], N:trechos.length};
  return KB_IDX;
}
function kbDist(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length:a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function kbBuscar(pergunta){
  const ix = kbIndice();
  let qs = [...new Set(kbTokens(pergunta))];
  // tolerância a erros de digitação
  qs = qs.map(q => { if (ix.df[q] || q.length < 4) return q;
    let melhor = null, md = q.length >= 7 ? 2 : 1;
    ix.vocab.forEach(v => { const d = kbDist(q, v); if (d <= md && (!melhor || d < melhor.d)) melhor = {v, d}; });
    return melhor ? melhor.v : q; });
  const termos = [];
  qs.forEach(q => { termos.push([q, 1]); if (KB_GRUPO[q]) termos.push([KB_GRUPO[q], .7]); });
  if (!termos.length) return {qs, res:[]};
  const idf = t => Math.log(1 + ix.N / (ix.df[t] || .5));
  const porArtigo = {};
  ix.trechos.forEach(tr => {
    let s = 0, achou = 0;
    termos.forEach(([t, w]) => { const f = tr.tf[t] || 0, x = tr.extra[t] || 0;
      if (f || x){ s += w * idf(t) * ((f ? 1 + Math.log(f) : 0) + x); if (w === 1) achou++; } });
    if (!s) return;
    s *= 0.6 + 0.4 * (achou / Math.max(qs.length, 1));   // favorece trechos que cobrem mais palavras da pergunta
    const atual = porArtigo[tr.a.id];
    if (!atual || s > atual.s) porArtigo[tr.a.id] = {a:tr.a, tr, s};
  });
  const res = Object.values(porArtigo).sort((x, y) => y.s - x.s);
  return {qs, res: res.length && res[0].s >= 2 ? res.slice(0, 4) : []};
}
function kbTrecho(tr, qs, max = 340){
  let t = tr.texto;
  if (t.length > max){ const corte = t.lastIndexOf('. ', max); t = t.slice(0, corte > 120 ? corte + 1 : max) + (corte > 120 ? '' : '…'); }
  const alvo = new Set(qs);
  return esc(t).replace(/[A-Za-zÀ-ÿ0-9]+/g, w => alvo.has(kbStem(kbNorm(w))) && !KB_STOP.has(kbNorm(w)) ? `<mark>${w}</mark>` : w);
}

function chatHTML(){

  if (!S.chat.length) return `<div class="kb-msg bot"><p>Olá! Escreva sua dúvida do jeito que falaria, por exemplo “cliente pagou só uma venda”. Eu procuro a resposta nos artigos de ajuda.</p>

    return `<div class="kb-msg eu">${esc(m.q)}</div><div class="kb-msg bot">${resposta}</div>`;
  }).join('');
}
function telaAjuda(id){

    if (!a) return `<div class="head"><div><a href="#ajuda" class="muted" style="text-decoration:none;font-weight:600">‹ Ajuda</a><h1>Artigo não encontrado</h1></div></div>`;

    <section class="panel kb-chat"><h2>Pergunte algo</h2>

        <button class="btn pri" type="submit">Perguntar</button></form>
      ${(S.chat || []).length ? '<button type="button" class="btn" data-kblimpar style="margin-top:10px">Limpar conversa</button>' : ''}</section>
    ${KB_GRUPOS.map(g => `<div class="secao">${g}</div><div class="tiles">${KB.filter(a => a.g === g).map(a => `<a class="tile" href="#ajuda/${a.id}"><b>${esc(a.t)}</b><small>${esc(a.r)}</small></a>`).join('')}</div>`).join('')}`;
}
function ligarAjuda(v){
  const form = v.querySelector('#kbForm'); if (!form) return;
  const log = v.querySelector('#kbLog'), inp = v.querySelector('#kbIn');
  const perguntar = q => {
    q = String(q || '').trim(); if (!q) return;
    const {qs, res} = kbBuscar(q); (S.chat ||= []).push({q, qs, res});
    if (S.chat.length > 20) S.chat.shift();
    rota(); const l = $('#kbLog'); if (l) l.scrollTop = l.scrollHeight; const i = $('#kbIn'); if (i) i.focus({preventScroll:true});
  };
