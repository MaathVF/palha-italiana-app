/* ============ DEPOIS DE SALVAR UMA COMPRA ============ */
async function posCompra(c, cid, lig){
  const partes = [await aplicarPrecoCompra(c, cid)];
  const i = ingPorNome(c.ingrediente);
  if (i && lig && lig.visivel()){
    let lotes = 0, vendas = 0;
    for (const f of fornadasDoIngrediente(i.nome)){
      const fid = String(f.id), atual = lig.ligadaA(f, i.nome), quer = lig.marcadas.has(fid);
      if (quer && atual !== String(cid)){ vendas += await trocarCompraNaFornada(loteDe(fid), i.nome, cid); lotes++; }
      else if (!quer && atual === String(cid)){ vendas += await trocarCompraNaFornada(loteDe(fid), i.nome, ''); lotes++; }
    }
    if (lotes) partes.push(`${lotes} ${lotes === 1 ? 'lote recalculado' : 'lotes recalculados'}${vendas ? ` e ${vendas} ${vendas === 1 ? 'venda' : 'vendas'}` : ''}`);
  }
  if (i && (!c.tipo || c.tipo === 'Ingrediente')){
    const e = estoqueDe(i.nome), it = compraNoEstoque(i.nome, cid), u = i.unidade || 'g';
    if (it) partes.push(it.status === 'Em uso' ? 'Esta compra está em uso'
      : it.status === 'Na fila' ? `Na fila; em uso continua a de ${dataBR(e.emUso.c.data)} (resta ${fmtQ(Math.max(e.emUso.resta, 0), u)})`
      : 'Esta compra já foi consumida pelas fornadas ligadas');
  }
  return partes.filter(Boolean).join('. ');
}

/* Guarda no cadastro o último preço pago (usado quando não há compra em estoque) */
async function aplicarPrecoCompra(c, id){
  const nome = String(c.ingrediente || '').trim().toLowerCase();
  const i = S.Ingredientes.find(x => String(x.nome).toLowerCase() === nome);
  if (!i) return 'Compra salva. Esse item não está nos ingredientes, então não entra no estoque';
  if (c.tipo && c.tipo !== 'Ingrediente') return 'Compra salva';
  const maisNova = S.Compras.some(x => String(x.id) !== String(id) && String(x.ingrediente).trim().toLowerCase() === nome && String(x.data) > String(c.data));
  if (maisNova) return `Compra de ${i.nome} salva`;
  const q = num(c.quantidade), emb = num(i.qtd_embalagem), u = c.unidade || 'un', iu = i.unidade || 'g';
  if (!(q > 0) || !(num(c.valor) > 0) || !emb) return `Compra salva. Informe a quantidade para ela entrar no estoque de ${i.nome}`;
  const fator = ({g:{g:1, kg:1000}, ml:{ml:1, L:1000}, un:{un:1}})[iu] || {};
  let base = 0;
  if (u === 'pacote' || (u === 'un' && iu !== 'un')) base = q * emb;
  else if (fator[u]) base = q * fator[u];
  if (!base) return `Compra salva. A unidade "${u}" não combina com ${iu}, então ela não entra no estoque de ${i.nome}`;
  const novo = r2(num(c.valor) / base * emb), antigo = num(i.preco_embalagem);
  if (novo !== r2(antigo)) await salvar('Ingredientes', {preco_embalagem:novo, mercado:c.mercado || i.mercado || ''}, i.id);
  return `Compra de ${i.nome} salva (${brl(novo)} por ${emb} ${iu})`;
}


/* ============ ESTOQUE POR INGREDIENTE ============
   Cada compra de ingrediente (com quantidade) é um estoque: Em uso, Na fila ou Acabou.
   Cada fornada grava em "compras_usadas" qual compra usou de cada ingrediente, quanto e a que preço. */
let EST = null;
const mesmoNome = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
const ingPorNome = nome => S.Ingredientes.find(i => mesmoNome(i.nome, nome));
const precoCadastro = i => i && num(i.qtd_embalagem) ? num(i.preco_embalagem) / num(i.qtd_embalagem) : 0;
const fmtQ = (v, u) => (Math.round(num(v) * 10) / 10).toLocaleString('pt-BR') + ' ' + (u || '');
function baseCompra(c, i){
  const q = num(c.quantidade), emb = num(i.qtd_embalagem), u = c.unidade || 'un', iu = i.unidade || 'g';
  if (!(q > 0)) return 0;
  if (u === 'pacote' || (u === 'un' && iu !== 'un')) return emb ? q * emb : 0;
  const fator = ({g:{g:1, kg:1000}, ml:{ml:1, L:1000}, un:{un:1}})[iu] || {};
  return fator[u] ? q * fator[u] : 0;
}
const usadasDe = f => { try { const o = JSON.parse(f && f.compras_usadas || '{}'); return o && typeof o === 'object' ? o : {}; } catch(e){ return {}; } };
function estoqueTudo(){
  if (EST) return EST;
  const uso = {}, onde = {};
  S.Fornadas.forEach(f => Object.values(usadasDe(f)).forEach(x => { if (!x || !x.c) return; uso[x.c] = (uso[x.c] || 0) + num(x.q); (onde[x.c] ||= []).push(f); }));
  return EST = {uso, onde, por:{}};
}
function estoqueDe(nome){
  const T = estoqueTudo(), k = String(nome || '').trim().toLowerCase();
  if (T.por[k]) return T.por[k];
  const i = ingPorNome(nome);
  if (!i) return T.por[k] = {i:null, itens:[], emUso:null, semQtd:[]};
  const itens = [], semQtd = [];
  S.Compras.filter(c => mesmoNome(c.ingrediente, i.nome) && (!c.tipo || c.tipo === 'Ingrediente')).forEach(c => {
    const base = baseCompra(c, i);
    if (!base || !(num(c.valor) > 0)){ semQtd.push(c); return; }
    const usado = (T.uso[String(c.id)] || 0) + num(c.consumo_ajuste);
    itens.push({c, base, pu:num(c.valor) / base, usado, resta:base - usado, fornadas:T.onde[String(c.id)] || []});
  });
  itens.sort((a,b) => String(a.c.data).localeCompare(String(b.c.data)) || String(a.c.id).localeCompare(String(b.c.id)));
  itens.forEach(x => x.acabou = x.c.status_manual === 'Acabou' || (x.resta <= 0.0001 && x.c.status_manual !== 'Em uso'));
  const manual = itens.filter(x => x.c.status_manual === 'Em uso');
  const emUso = manual.length ? manual[manual.length - 1] : itens.find(x => !x.acabou) || null;
  itens.forEach(x => x.status = x === emUso ? 'Em uso' : x.acabou ? 'Acabou' : 'Na fila');
  return T.por[k] = {i, itens, emUso, semQtd};
}
const compraNoEstoque = (ing, cid) => cid ? estoqueDe(ing).itens.find(y => String(y.c.id) === String(cid)) || null : null;
function escolhasPadrao(rec){ const e = {}; itensDe(rec).forEach(x => { const s = estoqueDe(x.ingrediente); e[x.ingrediente] = s.emUso ? String(s.emUso.c.id) : ''; }); return e; }
function emUsoMapa(rec){ const e = {}; itensDe(rec).forEach(x => { const s = estoqueDe(x.ingrediente); e[x.ingrediente] = s.emUso ? String(s.emUso.c.id) : ''; }); return e; }
async function recalcVendasLote(id){
  const f = loteDe(id); if (!f) return 0; let n = 0;
  for (const v of S.Vendas.filter(x => String(x.lote) === String(id))){
    const c = calcVenda({...v, rendimento:num(f.rendimento_real)});
    if (c.custo_preparo !== r2(num(v.custo_preparo)) || c.lucro_disponivel !== r2(num(v.lucro_disponivel))){ await salvar('Vendas', {...c, rendimento:num(f.rendimento_real)}, v.id); n++; }
  }
  return n;
}
/* Depois de uma fornada consumir estoque: libera a compra marcada à mão que zerou e avisa as trocas */
async function posConsumo(usadasJSON, antes){
  let us = {}; try { us = JSON.parse(usadasJSON || '{}'); } catch(e){}
  const avisos = [];
  for (const [ing, x] of Object.entries(us)){
    if (!x || !x.c) continue;
    const it = compraNoEstoque(ing, x.c);
    if (it && it.c.status_manual === 'Em uso' && it.resta <= 0.0001) await salvar('Compras', {status_manual:''}, it.c.id);
    const e = estoqueDe(ing), novo = e.emUso ? String(e.emUso.c.id) : '';
    if (antes && antes[ing] && antes[ing] !== novo)
      avisos.push(e.emUso ? `${ing}: a compra anterior acabou; agora está em uso a de ${dataBR(e.emUso.c.data)}` : `${ing}: o estoque acabou, registre uma compra`);
  }
  return avisos;
}
/* Liga (ou desliga) uma compra a uma fornada já registrada e recalcula o lote e as vendas dele */
async function trocarCompraNaFornada(f, ingNome, compraId){
  const item = itensDe(f.receita).find(x => mesmoNome(x.ingrediente, ingNome)); if (!item) return 0;
  const us = usadasDe(f);
  if (!Object.keys(us).length) itensDe(f.receita).forEach(x => us[x.ingrediente] = {c:'', q:num(x.quantidade), p:Math.round(precoCadastro(ingrediente(x.ingrediente)) * 1e6) / 1e6});
  const it = compraNoEstoque(item.ingrediente, compraId);
  us[item.ingrediente] = {c: it ? String(it.c.id) : '', q:num(item.quantidade), p:Math.round((it ? it.pu : precoCadastro(ingrediente(item.ingrediente))) * 1e6) / 1e6};
  const ci = Object.values(us).reduce((s, x) => s + num(x.q) * num(x.p), 0);
  const ca = f.custo_adicional !== '' && f.custo_adicional != null ? num(f.custo_adicional) : adicional('Por fornada');
  const rend = num(f.rendimento_real) || rendPadrao(f.receita);
  await salvar('Fornadas', {compras_usadas:JSON.stringify(us), custo_ingredientes:r2(ci), custo_adicional:r2(ca), custo_total:r2(ci + ca),
    custo_unitario:Math.round((ci + ca) / rend * 10000) / 10000, lote:num(f.lote) || proximoLote()}, f.id);
  return recalcVendasLote(f.id);
}
function comprasDoLoteTxt(f){
  const us = usadasDe(f), partes = Object.entries(us).filter(([, x]) => x && x.c).map(([ing, x]) => { const c = S.Compras.find(k => String(k.id) === String(x.c)); return c ? `${esc(ing)} (${dataBR(c.data)})` : ''; }).filter(Boolean);
  return partes.length ? `<p class="muted" style="font-size:13px;margin:8px 0 0">Compras usadas: ${partes.join(' · ')}</p>` : '';
}

/* ============ TELA: ESTOQUE DE UM INGREDIENTE ============ */
function telaEstoque(nome){
  const e = estoqueDe(nome);
  if (!e.i) return `<div class="head"><div><a href="#cad/Ingredientes" class="muted" style="text-decoration:none;font-weight:600">‹ Ingredientes</a><h1>Ingrediente não encontrado</h1></div></div>`;
  const i = e.i, u = i.unidade || 'g', emb = num(i.qtd_embalagem) || 1;
  const em = e.itens.filter(x => x.status === 'Em uso'), fila = e.itens.filter(x => x.status === 'Na fila'),
        acab = e.itens.filter(x => x.status === 'Acabou').reverse();
  const card = x => {
    const p = Math.min(Math.max(x.usado / x.base, 0), 1);
    const lotes = x.fornadas.map(f => nomeLote(f)).join(', ');
    const bt = [];
    if (x.status === 'Em uso') bt.push(`<button class="btn" data-est="acabou" data-id="${esc(x.c.id)}">Marcar como acabou</button>`);
    if (x.status === 'Na fila') bt.push(`<button class="btn" data-est="usar" data-id="${esc(x.c.id)}">Usar agora</button>`);
    if (x.status === 'Acabou') bt.push(`<button class="btn" data-est="usar" data-id="${esc(x.c.id)}">Voltar a usar</button>`);
    bt.push(`<button class="btn" data-est="ajustar" data-id="${esc(x.c.id)}">Corrigir quanto resta</button>`);
    return `<section class="panel"><div class="grupo-top"><div><b>Compra de ${dataBR(x.c.data)}</b>
      <div class="muted" style="font-size:13px">${[x.c.mercado, fmtQ(x.base, u), brl(x.c.valor) + (Math.abs(x.base - emb) > 0.01 ? ` (${brl(x.pu * emb)} por ${fmtQ(emb, u)})` : '')].filter(Boolean).map(esc).join(' · ')}</div></div>
      <span class="badge ${x.status === 'Em uso' ? 'b-ok' : x.status === 'Na fila' ? 'b-warn' : ''}">${x.status}</span></div>
      <div class="lote-barra" style="margin-top:12px" aria-hidden="true"><div class="v" style="width:${(p * 100).toFixed(1)}%;background:var(--caramelo)"></div></div>
      <div style="font-size:14px">Usado <b class="num">${fmtQ(Math.max(x.usado, 0), u)}</b> de ${fmtQ(x.base, u)} · resta <b class="num">${fmtQ(Math.max(x.resta, 0), u)}</b></div>
      ${lotes ? `<div class="muted" style="font-size:13px;margin-top:4px">Usada em: ${esc(lotes)}</div>` : ''}
      ${num(x.c.consumo_ajuste) ? `<div class="muted" style="font-size:13px;margin-top:4px">Inclui ${fmtQ(x.c.consumo_ajuste, u)} de correção manual</div>` : ''}
      <div class="acoes">${bt.join('')}</div></section>`;
  };
  const sub = e.emUso ? `Em uso: compra de ${dataBR(e.emUso.c.data)} · ${brl(e.emUso.pu * emb)} por ${fmtQ(emb, u)} · resta ${fmtQ(Math.max(e.emUso.resta, 0), u)}`
    : `Nenhuma compra em uso. As fornadas usam o último preço do cadastro (${brl(num(i.preco_embalagem))} por ${fmtQ(emb, u)}).`;
  const bloco = (t, xs) => xs.length ? `<div class="secao">${t}</div><div class="grid g2">${xs.map(card).join('')}</div>` : '';
  return `<div class="head"><div><a href="#cad/Ingredientes" class="muted" style="text-decoration:none;font-weight:600">‹ Ingredientes</a><h1>${esc(i.nome)}</h1><p class="sub">${sub}</p></div>
    <button class="btn pri" data-novacompra="${esc(i.nome)}">${I.mais1} Registrar compra</button></div>
    ${e.itens.length ? bloco('Em uso', em) + bloco('Na fila', fila) + bloco('Já acabaram', acab)
      : `<section class="panel vazio"><b>Nenhuma compra no estoque</b>Registre as compras de ${esc(i.nome)} com a quantidade para o app controlar o estoque.</section>`}
    ${e.semQtd.length ? `<p class="muted" style="font-size:13px;margin-top:14px">${e.semQtd.length} ${e.semQtd.length === 1 ? 'compra está' : 'compras estão'} sem quantidade e não ${e.semQtd.length === 1 ? 'entra' : 'entram'} no estoque. Abra em <a href="#cad/Compras">Compras</a> e informe a quantidade.</p>` : ''}`;
}
async function acaoEstoque(acao, cid){
  const c = S.Compras.find(x => String(x.id) === String(cid)); if (!c) return;
  const e = estoqueDe(c.ingrediente), it = compraNoEstoque(c.ingrediente, cid), u = e.i?.unidade || 'g';
  if (acao === 'acabou'){ await salvar('Compras', {status_manual:'Acabou'}, cid); EST = null;
    const n = estoqueDe(c.ingrediente).emUso; toast(n ? `Agora em uso: compra de ${dataBR(n.c.data)}` : `${e.i.nome}: nenhuma compra na fila`); return rota(); }
  if (acao === 'usar'){
    for (const x of e.itens) if (x.c.status_manual === 'Em uso' && String(x.c.id) !== String(cid)) await salvar('Compras', {status_manual:''}, x.c.id);
    await salvar('Compras', {status_manual:'Em uso'}, cid); toast(`Compra de ${dataBR(c.data)} em uso`); return rota();
  }
  if (acao === 'ajustar' && it){
    const m = abrirModal('Corrigir quanto resta', `<p class="muted" style="margin:0 0 12px">Compra de ${dataBR(c.data)} · ${fmtQ(it.base, u)}. Pelas fornadas registradas, restam ${fmtQ(Math.max(it.resta, 0), u)}.</p>
      <div class="campo"><label for="e_resta">Quanto ainda resta de verdade (${u})</label><input id="e_resta" type="number" step="any" inputmode="decimal" value="${Math.max(Math.round(it.resta * 10) / 10, 0)}"></div>`, {salvar:'Salvar'});
    m.onSalvar = async () => {
      const v = m.querySelector('#e_resta').value; if (v === '') throw new Error('Informe quanto resta.');
      const resta = Math.min(Math.max(num(v), 0), it.base), usoForn = it.usado - num(c.consumo_ajuste);
      const d = {consumo_ajuste:r2(it.base - usoForn - resta)};
      if (c.status_manual === 'Acabou' && resta > 0) d.status_manual = '';
      if (c.status_manual === 'Em uso' && resta <= 0) d.status_manual = '';
      await salvar('Compras', d, cid); toast(resta > 0 ? `Resta ${fmtQ(resta, u)}` : 'Compra marcada como acabada');
    };
  }
}

/* ---- Campo "Usada em fornadas já registradas" no formulário de compra ---- */
function fornadasDoIngrediente(ing){
  return S.Fornadas.filter(f => itensDe(f.receita).some(x => mesmoNome(x.ingrediente, ing)))
    .sort((a,b) => String(b.data).localeCompare(String(a.data)) || num(b.lote) - num(a.lote));
}
function montarLigacaoCompra(m, compraId){
  const caixa = document.createElement('div'); caixa.className = 'campo'; caixa.id = 'c_fornbox';
  const obs = m.querySelector('#c_observacao')?.closest('.campo');
  obs ? obs.before(caixa) : m.querySelector('.m-body').appendChild(caixa);
  const marcadas = new Set();
  const ligadaA = (f, ing) => { const it = itensDe(f.receita).find(x => mesmoNome(x.ingrediente, ing)); const x = it && usadasDe(f)[it.ingrediente]; return x && x.c ? String(x.c) : ''; };
  let primeira = true;
  const desenhar = () => {
    const ing = m.querySelector('#c_ingrediente').value.trim(), tipo = m.querySelector('#c_tipo')?.value || '';
    const i = ingPorNome(ing);
    if (!i || (tipo && tipo !== 'Ingrediente')){ caixa.style.display = 'none'; return; }
    const fs = fornadasDoIngrediente(i.nome);
    if (primeira && compraId) fs.forEach(f => { if (ligadaA(f, i.nome) === String(compraId)) marcadas.add(String(f.id)); });
    primeira = false;
    const lista = fs.filter((f, k) => k < 12 || marcadas.has(String(f.id)));
    caixa.style.display = lista.length ? '' : 'none';
    caixa.innerHTML = `<label>Usada em fornadas já registradas</label>
      <small class="muted" style="display:block;margin:-2px 0 8px">Marque se esta compra foi usada em lotes que você já registrou. O custo deles e das vendas ligadas é recalculado.</small>
      <div class="ligar-lista">${lista.map(f => { const atual = ligadaA(f, i.nome), c = atual && S.Compras.find(k => String(k.id) === atual);
        const det = !Object.keys(usadasDe(f)).length;
        return `<label class="check" style="margin:0 0 8px"><input type="checkbox" data-lf="${esc(f.id)}" ${marcadas.has(String(f.id)) ? 'checked' : ''}>
          <span>${nomeLote(f)} · ${esc(f.receita)} · ${dataBR(f.data)}<small class="muted" style="display:block;font-size:12.5px">${atual === String(compraId) ? 'Ligada a esta compra' : c ? `Hoje usa a compra de ${dataBR(c.data)}` : 'Sem compra ligada'}${det ? ' · os outros ingredientes serão recalculados com o último preço do cadastro' : ''}</small></span></label>`; }).join('')}</div>`;
    caixa.querySelectorAll('[data-lf]').forEach(cb => cb.onchange = () => { cb.checked ? marcadas.add(cb.dataset.lf) : marcadas.delete(cb.dataset.lf); });
  };
  m.querySelector('#c_ingrediente').addEventListener('input', desenhar);
  m.querySelector('#c_ingrediente').addEventListener('change', desenhar);
  m.querySelector('#c_tipo')?.addEventListener('change', desenhar);
  desenhar();
  return { marcadas, ligadaA, visivel: () => caixa.style.display !== 'none' };
}

/* ============ FORNADA = LOTE ============ */
function formFornada(id){
  if (!S.Receitas.length){ toast('Cadastre ao menos uma receita antes.', true); location.hash = '#cad/Receitas'; return; }
  const f = id ? {...loteDe(id)} : {data:hoje(), receita:S.Receitas.filter(ativo)[0]?.nome || S.Receitas[0].nome, lote:proximoLote()};
  const nomes = S.Receitas.filter(r => ativo(r) || r.nome === f.receita).map(r => r.nome);
  const m = abrirModal(id ? 'Editar ' + nomeLote(f) : 'Nova fornada · Lote ' + f.lote, `
    <div class="duas"><div class="campo"><label for="f_data">Data</label><input type="date" id="f_data" value="${esc(f.data)}"></div>
      <div class="campo"><label for="f_rec">Receita</label><select id="f_rec">${nomes.map(n => `<option ${n === f.receita ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div></div>
    <div class="duas"><div class="campo"><label for="f_rend">Unidades produzidas</label><input id="f_rend" type="number" inputmode="numeric" value="${esc(f.rendimento_real ?? '')}" placeholder="${rendPadrao(f.receita)}"></div>
      <div class="campo"><label for="f_perd">Perdas (unidades)</label><input id="f_perd" type="number" inputmode="numeric" value="${esc(f.perdas ?? '')}" placeholder="0"></div></div>
    <div class="campo"><label>Ingredientes desta fornada</label><div id="f_ings" class="ing-lista"></div>
      <small class="muted">Vem marcada a compra em uso de cada ingrediente. Troque só se esta fornada usou outra.</small></div>
    ${id ? `<label class="check"><input type="checkbox" id="f_recalc"> Recalcular o custo com as compras marcadas acima</label>` : ''}
    <div class="campo"><label for="f_obs">Observação</label><input id="f_obs" value="${esc(f.observacao || '')}"></div>
    <div class="previa num" id="f_prev"></div>`, {salvar:'Salvar fornada', excluir:!!id});
  const q = s => m.querySelector(s);
  const guardadas = usadasDe(f);
  let escolha = id && Object.keys(guardadas).length ? Object.fromEntries(Object.entries(guardadas).map(([k, x]) => [k, x && x.c ? String(x.c) : ''])) : escolhasPadrao(f.receita);
  let mudou = false;
  const desenharIngs = () => {
    const rec = q('#f_rec').value, its = itensDe(rec);
    if (!its.length){ q('#f_ings').innerHTML = `<div class="muted" style="font-size:14px">Esta receita não tem ingredientes cadastrados. <a href="#itens/${encodeURIComponent(rec)}">Cadastrar</a></div>`; return; }
    q('#f_ings').innerHTML = its.map(x => {
      const e = estoqueDe(x.ingrediente), i = e.i || ingrediente(x.ingrediente), u = i?.unidade || 'g', emb = num(i?.qtd_embalagem) || 1, sel = String(escolha[x.ingrediente] || '');
      const op = it => `<option value="${esc(it.c.id)}" ${String(it.c.id) === sel ? 'selected' : ''}>${dataBR(it.c.data)} · ${brl(it.pu * emb)} · ${it.status === 'Acabou' ? 'acabou' : it.status.toLowerCase() + ', resta ' + fmtQ(Math.max(it.resta, 0), u)}</option>`;
      const abertos = e.itens.filter(it => it.status !== 'Acabou'), fechados = e.itens.filter(it => it.status === 'Acabou').reverse();
      const it = compraNoEstoque(x.ingrediente, sel), p = it ? it.pu : precoCadastro(i);
      return `<div class="ing-row"><div class="ing-nome"><b>${esc(x.ingrediente)}</b><small>${fmtQ(x.quantidade, u)} · ${brl(num(x.quantidade) * p)}</small></div>
        <select data-ing="${esc(x.ingrediente)}" aria-label="Compra usada de ${esc(x.ingrediente)}">${abertos.map(op).join('')}
          ${fechados.length ? `<optgroup label="Já acabaram">${fechados.map(op).join('')}</optgroup>` : ''}
          <option value="" ${sel ? '' : 'selected'}>Sem compra (cadastro: ${brl(precoCadastro(i) * emb)})</option></select></div>`;
    }).join('');
    q('#f_ings').querySelectorAll('[data-ing]').forEach(s => s.onchange = () => { escolha[s.dataset.ing] = s.value; mudou = true; desenharIngs(); prev(); });
  };
  const ler = () => {
    const rec = q('#f_rec').value, rend = num(q('#f_rend').value) || rendPadrao(rec);
    const atual = !id || (q('#f_recalc') && q('#f_recalc').checked) || rec !== f.receita || !num(f.custo_total) || mudou;
    const c = atual ? custoLote(rec, rend, escolha) : { custo_ingredientes:num(f.custo_ingredientes), custo_adicional:num(f.custo_adicional),
      custo_total:num(f.custo_total), custo_unitario: Math.round(num(f.custo_total) / rend * 10000) / 10000 };
    return { atual, d:{ lote:num(f.lote) || proximoLote(), data:q('#f_data').value, receita:rec, rendimento_real:rend, perdas:num(q('#f_perd').value), observacao:q('#f_obs').value.trim(), ...c } };
  };
  const prev = () => { const {atual, d} = ler();
    q('#f_prev').innerHTML = `<span>Ingredientes</span><b>${brl(d.custo_ingredientes)}</b><span>Custos por fornada</span><b>${brl(d.custo_adicional)}</b>
      <span>Custo do lote</span><b>${brl(d.custo_total)}</b><div class="tot"><span>Custo por unidade (${d.rendimento_real} un)</span><span>${brl(d.custo_unitario)}</span></div>
      <div class="muted" style="grid-column:1/-1;margin-top:4px">${atual ? 'Com os preços das compras marcadas acima.' : 'Com os preços gravados quando o lote foi criado.'}</div>`; };
  ['#f_rend','#f_perd','#f_recalc'].forEach(s => { const el = q(s); if (el) el.oninput = el.onchange = prev; });
  q('#f_rec').onchange = () => { escolha = escolhasPadrao(q('#f_rec').value); desenharIngs(); prev(); };
  desenharIngs(); prev();
  m.onSalvar = async () => {
    const {d} = ler();
    if (!d.data) throw new Error('Informe a data.');
    if (d.perdas > d.rendimento_real) throw new Error('As perdas não podem passar das unidades produzidas.');
    const antes = emUsoMapa(d.receita);
    const r = await salvar('Fornadas', d, id);
    const n = id ? await recalcVendasLote(id) : 0;
    const avisos = d.compras_usadas ? await posConsumo(d.compras_usadas, antes) : [];
    const msg = id ? (n ? `Lote salvo e ${n} ${n === 1 ? 'venda recalculada' : 'vendas recalculadas'}` : 'Lote salvo') : `Lote ${d.lote} criado: ${brl(d.custo_unitario)} por unidade`;
    toast([msg, ...avisos].join('. '));
  };
  m.onExcluir = async () => {
    const n = S.Vendas.filter(x => String(x.lote) === String(id)).length;
    if (n) throw new Error(`Este lote tem ${n} ${n === 1 ? 'venda ligada' : 'vendas ligadas'}. Troque o lote dessas vendas antes de excluir.`);
    await excluir('Fornadas', id); toast('Lote excluído');
  };
}

/* ---- Liga vendas antigas e completa fornadas antigas ---- */
function planoAntigos(){
  const fornadas = S.Fornadas.filter(f => !num(f.lote) || !num(f.custo_total)).sort((a,b) => String(a.data).localeCompare(String(b.data)));
  const plano = [], sobra = [];
  S.Vendas.filter(v => !loteDe(v.lote)).forEach(v => {
    const f = S.Fornadas.filter(f => f.receita === v.receita && String(f.data) <= String(v.data))
      .sort((a,b) => String(b.data).localeCompare(String(a.data)) || num(b.lote) - num(a.lote))[0];
    f ? plano.push({v, f}) : sobra.push(v);
  });
  return {fornadas, plano, sobra};
}
function organizarAntigos(){
  const {fornadas, plano, sobra} = planoAntigos();
  const porLote = {}; plano.forEach(({f}) => porLote[f.id] = (porLote[f.id] || 0) + 1);
  const rot = f => num(f.lote) ? nomeLote(f) : `Fornada de ${dataBR(f.data)}`;
  const m = abrirModal('Organizar registros antigos', `
    ${fornadas.length ? `<div class="secao" style="margin:0 0 6px">Fornadas que vão receber número e custo</div>
      <table><tbody>${fornadas.map(f => { const c = num(f.custo_total) ? null : custoLote(f.receita, f.rendimento_real, {});
        return `<tr><td>${dataBR(f.data)} · ${esc(f.receita)}</td><td class="r num">${c ? brl(c.custo_total) + ' <span class="muted">(preços de hoje)</span>' : 'custo mantido'}</td></tr>`; }).join('')}</tbody></table>` : ''}
    ${plano.length ? `<div class="secao" style="margin:16px 0 6px">Vendas que vão ser ligadas</div>
      <table><tbody>${Object.entries(porLote).map(([fid, n]) => { const f = loteDe(fid);
        return `<tr><td>${rot(f)} · ${esc(f.receita)}</td><td class="r num">${n} ${n === 1 ? 'venda' : 'vendas'}</td></tr>`; }).join('')}</tbody></table>
      <p class="muted" style="font-size:13px;margin:8px 0 0">Cada venda vai para a fornada mais recente da mesma receita feita até a data da venda. Depois, dá para trocar qualquer uma abrindo a venda.</p>` : ''}
    ${sobra.length ? `<p class="alerta" style="margin:12px 0 0">${sobra.length} ${sobra.length === 1 ? 'venda continua' : 'vendas continuam'} sem lote, porque não há fornada da mesma receita registrada antes da data ${sobra.length === 1 ? 'dela' : 'delas'}. Se quiser, registre essa fornada com a data certa e rode de novo.</p>` : ''}
    ${plano.length ? `<label class="check" style="margin-top:14px"><input type="checkbox" id="o_recalc" checked> Recalcular custo, reserva e lucro dessas vendas com o custo do lote</label>` : ''}
    ${!fornadas.length && !plano.length ? '<p class="muted">Nada para organizar.</p>' : ''}`,
    {salvar: 'Organizar'});
  m.onSalvar = async () => {
    const botao = m.querySelector('[data-ok]'); let feitas = 0, total = fornadas.length + plano.length;
    const passo = () => { feitas++; botao.textContent = `Salvando ${feitas} de ${total}…`; };
    for (const f of fornadas){
      const rend = num(f.rendimento_real) || rendPadrao(f.receita);
      const d = { lote: num(f.lote) || proximoLote(), rendimento_real: rend };
      Object.assign(d, num(f.custo_total) ? { custo_unitario: Math.round(num(f.custo_total) / rend * 10000) / 10000 } : custoLote(f.receita, rend, {}));
      await salvar('Fornadas', d, f.id); passo();
    }
    const recalc = m.querySelector('#o_recalc')?.checked;
    for (const {v, f} of plano){
      const d = { lote: f.id };
      if (recalc){ const rend = num(loteDe(f.id).rendimento_real); Object.assign(d, calcVenda({...v, lote:f.id, rendimento:rend}), {rendimento:rend}); }
      await salvar('Vendas', d, v.id); passo();
    }
    toast(`${fornadas.length ? fornadas.length + (fornadas.length === 1 ? ' fornada completada' : ' fornadas completadas') : ''}${fornadas.length && plano.length ? ' e ' : ''}${plano.length ? plano.length + (plano.length === 1 ? ' venda ligada' : ' vendas ligadas') : ''}`);
  };
}

function telaLotes(){
  const filtro = S.filtroLote || 'todos';
  let ls = S.Fornadas.map(f => ({f, r:resumoLote(f)}));
  if (filtro === 'abertos') ls = ls.filter(x => x.r.rest > 0);
  if (filtro === 'encerrados') ls = ls.filter(x => x.r.rest === 0);
  ls.sort((a,b) => String(b.f.data).localeCompare(String(a.f.data)) || num(b.f.lote) - num(a.f.lote));
  const chip = (k, t) => `<button class="chip ${filtro === k ? 'on' : ''}" data-flote="${k}">${t}</button>`;
  const semLote = S.Vendas.filter(v => !loteDe(v.lote)).length;
  const semCusto = S.Fornadas.filter(f => !num(f.lote) || !num(f.custo_total)).length;
  const linha = (t, val, cls = '') => `<tr><td>${t}</td><td class="r num ${cls}">${val}</td></tr>`;
  const card = ({f, r}) => {
    const pv = r.prod ? r.vend / r.prod * 100 : 0, pp = r.prod ? r.perd / r.prod * 100 : 0;
    return `<section class="panel"><div class="grupo-top"><div><b>${nomeLote(f)} · ${esc(f.receita)}</b>
      <div class="muted" style="font-size:13px">${dataBR(f.data)} · custo do lote ${brl(r.custo)} · ${brl(r.cu)} por unidade</div></div>
      <span class="badge ${r.rest > 0 ? 'b-warn' : 'b-ok'}">${r.rest > 0 ? 'Em venda' : 'Encerrado'}</span></div>
      <div class="lote-nums"><div><b class="num">${r.prod}</b><small>Produzidas</small></div><div><b class="num">${r.vend}</b><small>Vendidas</small></div>
        <div><b class="num">${r.perd}</b><small>Perdidas</small></div><div><b class="num">${r.rest}</b><small>Restam</small></div></div>
      <div class="lote-barra" aria-hidden="true"><div class="v" style="width:${pv.toFixed(1)}%"></div><div class="p" style="width:${pp.toFixed(1)}%"></div></div>
      <table><tbody>
        ${linha('Vendido' + (r.vendido - r.recebido > 0.004 ? ` <small class="muted">(${brl(r.vendido - r.recebido)} a receber)</small>` : ''), brl(r.vendido))}
        ${linha('− Custo das unidades vendidas', brl(r.custoVend))}
        ${linha('− Repasse', brl(r.repasse))}
        ${linha('− Reserva da empresa', brl(r.reserva))}
        ${r.perd ? linha(`− Perdas (${r.perd} un)`, brl(r.custoPerdas)) : ''}
        <tr><td><b>Lucro do lote</b></td><td class="r num ${r.lucro < 0 ? 'neg' : ''}"><b>${brl(r.lucro)}</b></td></tr></tbody></table>
      ${r.rest > 0 ? `<p class="muted" style="font-size:13px;margin:8px 0 0">${r.rest} em estoque, que custaram ${brl(r.estoque)}. O lucro cresce conforme forem vendidas.</p>` : ''}
      ${comprasDoLoteTxt(f)}
      <div class="acoes"><button class="btn" data-edit="Fornadas" data-id="${esc(f.id)}">Editar lote</button></div></section>`;
  };
  return `<div class="head"><div><a href="#mais" class="muted" style="text-decoration:none;font-weight:600">‹ Mais</a><h1>Lotes</h1>
    <p class="sub">Cada fornada é um lote, com o custo das compras de ingredientes que ela usou</p></div>
    <button class="btn pri" data-novo="Fornadas">${I.mais1} Nova fornada</button></div>
  <div class="filtros"><div class="chips">${chip('todos','Todos')}${chip('abertos','Em venda')}${chip('encerrados','Encerrados')}</div></div>
  ${semLote || semCusto ? `<section class="panel" style="margin-bottom:14px"><div class="grupo-top"><div><b>Registros de antes dos lotes</b>
    <div class="muted" style="font-size:13px">${[semLote ? `${semLote} ${semLote === 1 ? 'venda sem lote' : 'vendas sem lote'}` : '', semCusto ? `${semCusto} ${semCusto === 1 ? 'fornada sem número ou custo' : 'fornadas sem número ou custo'}` : ''].filter(Boolean).join(' · ')}</div></div>
    <button class="btn pri" data-ligar>Organizar agora</button></div></section>` : ''}
  ${ls.length ? `<div class="grid g2">${ls.map(card).join('')}</div>`
    : `<section class="panel vazio"><b>Nenhum lote ${filtro === 'todos' ? 'ainda' : 'aqui'}</b>Registre uma fornada sempre que produzir. O app grava o custo daquele dia e liga as vendas a ela.</section>`}`;
}

/* ============ CONFIGURAÇÕES ============ */
function telaConfig(){
  const c = S.config;
  return `<div class="head"><div><a href="#mais" class="muted" style="text-decoration:none;font-weight:600">‹ Mais</a><h1>Configurações</h1><p class="sub">Regras usadas em todos os cálculos</p></div></div>
  <section class="panel" style="max-width:640px"><form id="fcfg">
    <div class="campo"><label for="k_nome">Nome do negócio</label><input id="k_nome" value="${esc(c.nome_negocio || '')}" placeholder="Palha Italiana"></div>
    <div class="campo"><label>Regra da reserva da empresa</label><div class="seg" id="k_regra">
      <button type="button" data-v="igual_custo" class="${c.regra_reserva !== 'percentual' ? 'on' : ''}">Igual ao custo</button>
      <button type="button" data-v="percentual" class="${c.regra_reserva === 'percentual' ? 'on' : ''}">Percentual da venda</button></div></div>
    <div class="campo" id="k_pctbox"><label for="k_pct">Reserva (% do valor vendido)</label><input id="k_pct" type="number" step="any" inputmode="decimal" value="${c.reserva_percentual !== '' && c.reserva_percentual != null ? Math.round(pct(c.reserva_percentual)*1000)/10 : ''}"></div>
    <div class="duas"><div class="campo"><label for="k_rend">Rendimento padrão</label><input id="k_rend" type="number" inputmode="numeric" value="${esc(c.rendimento_padrao || '')}" placeholder="16"></div>
    <div class="campo"><label for="k_meta">Meta de lucro mensal (R$)</label><input id="k_meta" type="number" step="0.01" inputmode="decimal" value="${esc(c.meta_lucro_mensal || '')}"></div></div>
    <div class="campo"><label for="k_msg">Mensagem de cobrança no WhatsApp</label><textarea id="k_msg" placeholder="Oi, {nome}! Passando para lembrar do pagamento: {valor}.">${esc(c.mensagem_cobranca || '')}</textarea>
      <small class="muted">Use {nome} e {valor}; o app troca pelos dados do cliente.</small></div>
    <div class="campo"><label for="k_oferta">Mensagem para clientes sumidos</label><textarea id="k_oferta" placeholder="Oi, {nome}! Tem palha italiana fresquinha esta semana. Quer que eu separe para você?">${esc(c.mensagem_oferta || '')}</textarea></div>
    <div class="campo"><label for="k_alerta">Alerta de lote antigo (dias desde a fornada)</label><input id="k_alerta" type="number" inputmode="numeric" value="${esc(c.dias_alerta_lote || '')}" placeholder="7"></div>
    <button class="btn pri" type="submit">Salvar configurações</button></form></section>`;
}

/* ============ MODAL ============ */
function abrirModal(titulo, corpo, {salvar:txt = 'Salvar', excluir:podeExcluir = false} = {}){
  const m = $('#modal');
  m.innerHTML = `<form method="dialog" novalidate><div class="m-head"><h2>${titulo}</h2><button class="m-close" value="x" aria-label="Fechar">×</button></div>
    <div class="m-body">${corpo}</div>
    <div class="m-foot">${podeExcluir ? '<button type="button" class="btn perigo" data-del>Excluir</button>' : ''}
      <div class="dir"><button type="button" class="btn" data-cancel>Cancelar</button><button type="button" class="btn pri" data-ok>${txt}</button></div></div></form>`;
  m.onSalvar = null; m.onExcluir = null;
  const ok = m.querySelector('[data-ok]');
  const rodar = async (fn, botao) => {
    try{ botao.disabled = true; const t = botao.textContent; botao.textContent = 'Salvando…'; await fn(); m.close(); rota(); botao.textContent = t; }
    catch(e){ if (!e.silencioso) toast(e.message, true); botao.disabled = false; botao.textContent = botao === ok ? txt : 'Excluir'; }
  };
  ok.onclick = () => m.onSalvar && rodar(m.onSalvar, ok);
  m.querySelector('[data-cancel]').onclick = () => m.close();
  const del = m.querySelector('[data-del]');
  if (del) del.onclick = () => { if (confirm('Excluir este registro? Essa ação não pode ser desfeita.')) rodar(m.onExcluir, del); };
  m.showModal();
  return m;
}

/* ============ EVENTOS POR TELA ============ */
function ligar(base){
  const v = $('#view');
  v.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { S.mes = somaMes(S.mes, num(b.dataset.mes)); rota(); });
  v.querySelectorAll('[data-nova]').forEach(b => b.onclick = () => formVenda());
  v.querySelectorAll('[data-venda]').forEach(b => b.onclick = () => formVenda(b.dataset.venda));
  v.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { S.filtroStatus = b.dataset.fs; rota(); });
  v.querySelectorAll('[data-flote]').forEach(b => b.onclick = () => { S.filtroLote = b.dataset.flote; rota(); });
  v.querySelectorAll('[data-ligar]').forEach(b => b.onclick = () => organizarAntigos());
  v.querySelectorAll('[data-est]').forEach(b => b.onclick = async () => { b.disabled = true; try{ await acaoEstoque(b.dataset.est, b.dataset.id); }catch(e){ toast(e.message, true); b.disabled = false; } });
  v.querySelectorAll('[data-novacompra]').forEach(b => b.onclick = () => formCadastro('Compras', null, {ingrediente:b.dataset.novacompra, data:hoje(), unidade:'un', tipo:'Ingrediente'}));
  const fl = v.querySelector('[data-fl]'); if (fl) fl.onchange = () => { S.filtroLocal = fl.value; rota(); };
  v.querySelectorAll('[data-novo]').forEach(b => b.onclick = () => formCadastro(b.dataset.novo));
  v.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => formCadastro(b.dataset.edit, b.dataset.id);
    b.onkeydown = e => { if (e.key === 'Enter') b.click(); }; });
  v.querySelectorAll('[data-novoitem]').forEach(b => b.onclick = () => formCadastro('ReceitaItens', null, {receita:b.dataset.novoitem}));
  v.querySelectorAll('[data-repassar]').forEach(b => b.onclick = () => formCadastro('Repasses', null, {local:b.dataset.repassar, valor:b.dataset.saldo, data:hoje()}));
  v.querySelectorAll('[data-recarregar]').forEach(b => b.onclick = async () => { b.disabled = true; try{ await carregar(); toast('Dados atualizados'); rota(); }catch(e){ toast(e.message, true); b.disabled = false; } });
  v.querySelectorAll('[data-pagar]').forEach(b => b.onclick = async () => {
    const vs = S.Vendas.filter(x => x.status !== 'Pago' && (x.cliente || 'Sem nome') === b.dataset.pagar);
    b.disabled = true; b.textContent = 'Salvando…';
    try{ for (const x of vs) await salvar('Vendas', {status:'Pago', forma_pagamento:b.dataset.forma, data_pagamento:hoje()}, x.id);
      toast(`${vs.length === 1 ? 'Venda marcada' : vs.length + ' vendas marcadas'} como paga${vs.length === 1 ? '' : 's'}`); rota(); }
    catch(e){ toast(e.message, true); rota(); }
  });
  if (base === 'config'){
    let regra = S.config.regra_reserva === 'percentual' ? 'percentual' : 'igual_custo';
    const box = v.querySelector('#k_pctbox'); const mostra = () => box.style.display = regra === 'percentual' ? '' : 'none'; mostra();
    v.querySelector('#k_regra').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; regra = b.dataset.v;
      v.querySelectorAll('#k_regra button').forEach(x => x.classList.toggle('on', x === b)); mostra(); };
    v.querySelector('#fcfg').onsubmit = async e => {
      e.preventDefault(); const btn = e.submitter || v.querySelector('#fcfg [type=submit]'); btn.disabled = true;
      const p = v.querySelector('#k_pct').value;
      const d = { nome_negocio:v.querySelector('#k_nome').value.trim(), regra_reserva:regra, reserva_percentual: p === '' ? '' : num(p) / 100,
        rendimento_padrao: v.querySelector('#k_rend').value ? num(v.querySelector('#k_rend').value) : '',
        meta_lucro_mensal: v.querySelector('#k_meta').value ? num(v.querySelector('#k_meta').value) : '', mensagem_cobranca:v.querySelector('#k_msg').value.trim(),
        mensagem_oferta:v.querySelector('#k_oferta').value.trim(), dias_alerta_lote: v.querySelector('#k_alerta').value ? num(v.querySelector('#k_alerta').value) : '' };
      try{ S.config = await api('setConfig', {data:d}); toast('Configurações salvas'); if (S.config.nome_negocio) $('#brand').firstChild.textContent = S.config.nome_negocio; }
      catch(err){ toast(err.message, true); } btn.disabled = false;
    };
  }
}

/* ============ INÍCIO ============ */
async function iniciar(){
  montarNav();
  window.addEventListener('hashchange', () => { rota(); $('#view').focus({preventScroll:true}); window.scrollTo(0,0); });
  if (API_URL.startsWith('COLE_') || TOKEN.startsWith('COLE_')){
    $('#view').innerHTML = `<section class="panel vazio" style="max-width:560px;margin:10vh auto"><b>Falta conectar a planilha</b>
      Abra o arquivo index.html, procure por <code>API_URL</code> e <code>TOKEN</code> no início do script e cole a URL do App da Web do Apps Script e o token que você definiu.</section>`;
    return;
  }
  try{ await carregar(); rota(); }
  catch(e){
    $('#view').innerHTML = `<section class="panel vazio" style="max-width:560px;margin:10vh auto"><b>Não foi possível carregar os dados</b>${esc(e.message)}
      <div style="margin-top:16px"><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div></section>`;
  }
}
iniciar();
</script>
