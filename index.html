<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A2217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Palha Italiana · Vendas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='12' y='22' width='76' height='56' rx='10' fill='%233A2217'/><circle cx='30' cy='40' r='4' fill='%23F2E6D3'/><circle cx='55' cy='35' r='3' fill='%23F2E6D3'/><circle cx='70' cy='55' r='4' fill='%23F2E6D3'/><circle cx='40' cy='60' r='3' fill='%23F2E6D3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --choco:#3A2217;      /* chocolate amargo */
  --cacau:#6B4330;      /* cacau */
  --caramelo:#C98B2B;   /* caramelo / biscoito tostado */
  --acucar:#FFFCF7;     /* açúcar de confeiteiro */
  --leite:#F3ECE2;      /* fundo: leite em pó */
  --ninho:#2F5D8C;      /* azul (sabor Ninho / reserva) */
  --ok:#2F7A4A; --warn:#B8621B; --erro:#B3261E;

  --bg:var(--leite); --surface:var(--acucar); --surface-2:#EDE3D5;
  --text:#2A1A12; --muted:#6F5A4C; --line:#E2D5C3;
  --side-bg:var(--choco); --side-text:#F3E7D6; --side-muted:#BFA48E;
  --accent:var(--caramelo); --accent-text:#2A1A12;
  --shadow:0 1px 0 rgba(58,34,23,.06), 0 8px 24px -12px rgba(58,34,23,.25);
  --radius-l:18px; --radius-m:12px; --radius-s:8px;
  --font-d:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-b:'Figtree', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B120D; --surface:#261912; --surface-2:#30211A;
    --text:#F2E6D6; --muted:#B49C88; --line:#3E2C22;
    --side-bg:#120B07; --side-text:#F2E6D6; --side-muted:#9C836F;
    --accent:#E0A646; --ninho:#6E9CCB; --ok:#5DBB7E; --warn:#E39448; --erro:#F2847B;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);max-width:1120px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--side-bg);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--side-muted);text-decoration:none;font-size:11.5px;font-weight:600;border-radius:10px}
.tabbar a.on{color:var(--side-text)}
.tabbar a.on svg{color:var(--accent)}
.tabbar svg{width:22px;height:22px}

@media (min-width:900px){
  .app{grid-template-columns:240px 1fr}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-text);padding:28px 16px}
  .brand{font:800 22px/1.1 var(--font-d);letter-spacing:-.01em;padding:0 10px 26px}
  .brand small{display:block;font:500 13px/1.4 var(--font-b);color:var(--side-muted);margin-top:4px;letter-spacing:0}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-muted);text-decoration:none;font-weight:600}
  .side a:hover{color:var(--side-text);background:rgba(255,255,255,.05)}
  .side a.on{color:var(--side-text);background:rgba(255,255,255,.08)}
  .side a.on svg{color:var(--accent)}
  .side svg{width:20px;height:20px}
  .side .foot{margin-top:auto;font-size:12.5px;color:var(--side-muted);padding:0 12px}
  main{padding:36px 40px 60px}
}

/* ============ TIPOGRAFIA E BLOCOS ============ */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font:800 clamp(26px,5vw,36px)/1.05 var(--font-d);letter-spacing:-.02em;margin:0}
h2{font:700 19px/1.2 var(--font-d);margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Mês */
.mes{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mes button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.mes button:hover{background:var(--surface-2)}
.mes span{min-width:128px;text-align:center;font-weight:700;text-transform:capitalize}

/* Números do mês */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);padding:16px 18px}
.kpi b{display:block;font:700 clamp(20px,3.6vw,26px)/1.15 var(--font-d);letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.lucro{background:var(--choco);color:#F6EBDD}
.kpi.lucro span{color:#CDB49C}
@media (prefers-color-scheme: dark){.kpi.lucro{background:#3A2418}}

/* A barra: para onde vai o dinheiro (elemento principal) */
.barra{display:flex;height:64px;border-radius:14px;overflow:hidden;background:var(--surface-2);margin:6px 0 14px}
.barra div{min-width:0;transition:flex-grow .5s ease}
.seg-custo{background:var(--cacau)}
.seg-repasse{background:var(--caramelo)}
.seg-reserva{background:var(--ninho)}
.seg-lucro{background:#7FB08A;background-image:radial-gradient(rgba(255,255,255,.75) 1.2px,transparent 1.6px),radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.4px);background-size:14px 14px,9px 9px;background-position:0 0,5px 6px}
.legenda{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
@media (min-width:700px){.legenda{grid-template-columns:repeat(4,1fr)}}
.legenda div{display:flex;gap:9px;align-items:flex-start}
.legenda i{width:12px;height:12px;border-radius:3px;margin-top:5px;flex:none}
.legenda b{display:block;font-weight:700}
.legenda small{color:var(--muted);font-size:12.5px}

.meta-trilho{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0 8px}
.meta-trilho div{height:100%;background:var(--accent);border-radius:99px}

/* Tabelas simples */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* Listas */
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:13px}
.item .v{text-align:right;white-space:nowrap}
.item .v b{display:block;font-weight:700}

.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-off{background:var(--surface-2);color:var(--muted)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--choco);border-color:var(--choco);color:#F6EBDD}
.btn.pri:hover{filter:brightness(1.15)}
@media (prefers-color-scheme: dark){.btn.pri{background:var(--accent);border-color:var(--accent);color:#24160F}}
.btn.perigo{color:var(--erro)}
.btn.zap{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.55;pointer-events:none}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:21;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-text);box-shadow:0 10px 24px -8px rgba(58,34,23,.5);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{display:none}}
.so-desk{display:none}
@media (min-width:900px){.so-desk{display:inline-flex}}

/* Chips / filtros */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:99px;font-weight:600;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--choco);color:#F6EBDD;border-color:var(--choco)}
@media (prefers-color-scheme: dark){.chip.on{background:var(--accent);color:#24160F;border-color:var(--accent)}}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros select{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:600;font-size:13.5px}

/* Mais */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;padding:16px;border-radius:var(--radius-m);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font:700 16px/1.2 var(--font-d)}
.tile small{color:var(--muted);font-size:13px}
.secao{font:700 14px/1 var(--font-b);color:var(--muted);margin:22px 0 10px}

/* Formulários e modal */
dialog{border:0;padding:0;background:var(--surface);color:var(--text);width:min(560px,100%);max-height:92vh;border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(30,18,12,.55)}
@media (max-width:640px){
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;max-height:94vh}
}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.m-head h2{margin:0}
.m-close{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.m-body{padding:10px 20px 8px;overflow-y:auto;max-height:calc(92vh - 140px)}
.m-foot{display:flex;gap:10px;justify-content:space-between;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line)}
.m-foot .dir{display:flex;gap:10px;margin-left:auto}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.campo label{font-size:13px;font-weight:600;color:var(--muted)}
.campo input,.campo select,.campo textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.campo textarea{min-height:80px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.stepper button{border:0;background:none;width:46px;height:44px;font-size:22px;cursor:pointer}
.stepper input{border:0;background:none;text-align:center;flex:1;min-width:0;font-weight:700;font-size:17px;min-height:44px}
.previa{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13.5px}
.previa b{text-align:right}
.previa .tot{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}

/* Estados */
.vazio{text-align:center;padding:30px 14px;color:var(--muted)}
.vazio b{display:block;color:var(--text);font:700 17px/1.3 var(--font-d);margin-bottom:6px}
.passos{counter-reset:p;list-style:none;padding:0;margin:14px 0 0}
.passos li{counter-increment:p;display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.passos li::before{content:counter(p);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;flex:none}
.passos li.feito::before{content:"✓";background:var(--ok);color:#fff}
.passos li a{margin-left:auto}
.carregando{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:g 0.8s linear infinite;margin:0 auto 12px}
@keyframes g{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--choco);color:#F6EBDD;padding:11px 18px;border-radius:12px;font-weight:600;z-index:100;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.erro{background:var(--erro);color:#fff}
@media (min-width:900px){.toast{bottom:30px}}
.grupo{border-bottom:1px solid var(--line);padding:14px 0}
.grupo:last-child{border-bottom:0}
.grupo-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grupo-top b{font:700 17px/1.2 var(--font-d)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lote-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}
.lote-nums div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.lote-nums b{display:block;font:700 18px/1.15 var(--font-d)}
.lote-nums small{font-size:11.5px;color:var(--muted)}
.lote-barra{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:0 0 12px}
.lote-barra .v{background:var(--ok)} .lote-barra .p{background:var(--erro)}
.neg{color:var(--erro)}
.picker{position:absolute;inset:0;z-index:5;background:var(--surface);padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;overflow-y:auto;border-radius:inherit}
.picker h2{margin-bottom:10px}
.lote-op{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.lote-op b{display:block;font-size:15px}
.lote-op small{color:var(--muted);font-size:13px}
.lote-op.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.lote-campo{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
.lote-campo.pendente{border-color:var(--warn)}
.lote-campo small{color:var(--warn);font-weight:600;font-size:12px}
.grid>*,.stack>*,main{min-width:0}
a.btn:not(.pri):not(.zap){color:var(--text)}
td.num{white-space:nowrap}
@media (max-width:640px){.graf .g-txt{font-size:24px}}
.kpis.k6{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.kpis.k6{grid-template-columns:repeat(3,1fr)}}
.delta{display:block;font-size:12px;font-weight:600;margin-top:4px;color:var(--muted)}
.delta.up{color:var(--ok)} .delta.down{color:var(--erro)}
.kpi.lucro .delta{color:#CDB49C} .kpi.lucro .delta.up{color:#A8DDB5} .kpi.lucro .delta.down{color:#F5AFA6}
.legenda.l2{grid-template-columns:repeat(2,1fr)}
.graf{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.g-grade{stroke:var(--line);stroke-dasharray:3 5} .g-eixo{stroke:var(--line);stroke-width:1.5}
.g-txt{fill:var(--muted);font:500 15px var(--font-b)} .g-sel{fill:var(--text);font-weight:700}
.g-vend{fill:var(--caramelo)} .g-luc{fill:#7FB08A}
.leg-mini{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.leg-mini span{display:inline-flex;align-items:center;gap:6px}
.leg-mini i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:2px}
.hb{display:grid;grid-template-columns:minmax(70px,32%) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:14px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hb-t div{height:100%;background:var(--accent);border-radius:99px}
.hb b{font-weight:600;font-size:13.5px;white-space:nowrap}
.grande{font:700 22px/1.2 var(--font-d);margin:2px 0}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:2px 0 14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.alerta{grid-column:1/-1;color:var(--warn);font-weight:600;margin-top:4px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Menu">
    <div class="brand" id="brand">Palha Italiana<small>Vendas e resultados</small></div>
    <nav id="navSide"></nav>
    <div class="foot" id="sync">—</div>
  </aside>
  <main id="view" tabindex="-1"><div class="carregando"><div><div class="spin"></div>Carregando dados da planilha…</div></div></main>
</div>
<nav class="tabbar" id="navTab" aria-label="Navegação"></nav>
<button class="fab" id="fab" aria-label="Nova venda" hidden></button>
<dialog id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO — cole aqui a URL do App da Web e o token
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwOCb30c6wqrgKSPvEMcmXAvFJ8Ogl7XHjW0yYwxv0We1_h-M7AeAB8kiMXqUxl2AKs/exec';
const TOKEN   = 'palha-2026-xk7';

/* ============ ÍCONES ============ */
const I = {
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

/* ============ ESTADO ============ */
const TABELAS = ['Ingredientes','Receitas','ReceitaItens','Precos','CustosAdicionais','Locais','Clientes','Vendas','Repasses','Compras','Fornadas'];

/* ============ UTILITÁRIOS ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => {
  if (typeof v === 'number') return v; if (v === '' || v == null) return 0;
  const s = String(v).trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);           // 3.95 (campo numérico)
  const n = parseFloat(s.replace(/\./g,'').replace(',', '.'));     // 1.234,56 (formato BR)
  return isNaN(n) ? 0 : n;
};
const pct = v => { const n = num(v); return n > 1 ? n / 100 : n; };
const r2 = v => Math.round(v * 100) / 100;
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dataBR = s => s ? String(s).slice(8,10) + '/' + String(s).slice(5,7) : '';
const nomeMes = m => { const [a,mm] = m.split('-').map(Number); return new Date(a, mm-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); };
const somaMes = (m, d) => { const [a,mm] = m.split('-').map(Number); const x = new Date(a, mm-1+d, 1); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0'); };
const ativo = r => String(r.ativo || 'Sim') !== 'Não';
const soma = (arr, k) => arr.reduce((s, r) => s + num(r[k]), 0);

function toast(msg, erro){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (erro ? ' erro' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', erro ? 4500 : 2400);
}

/* ============ API (JSONP) ============ */
function api(action, params = {}){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const fim = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { fim(); reject(new Error('A planilha demorou para responder. Tente de novo.')); }, 25000);
    window[cb] = r => { fim(); r && r.ok ? resolve(r.data) : reject(new Error((r && r.erro) || 'Erro desconhecido')); };
    s.onerror = () => { fim(); reject(new Error('Não foi possível conectar à planilha. Confira a URL e a internet.')); };
    const q = new URLSearchParams({action, token:TOKEN, callback:cb});
    Object.entries(params).forEach(([k,v]) => q.set(k, typeof v === 'object' ? JSON.stringify(v) : v));
    s.src = API_URL + '?' + q.toString();
    document.body.appendChild(s);
  });
}
async function carregar(){
  const d = await api('getAll');
  S.config = d.config || {};
  TABELAS.forEach(t => S[t] = d[t] || []);
  $('#sync').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  if (S.config.nome_negocio) $('#brand').firstChild.textContent = S.config.nome_negocio;
}
async function salvar(tabela, obj, id){
  const r = id ? await api('update', {sheet:tabela, id, data:obj}) : await api('add', {sheet:tabela, data:obj});
  if (id){ const i = S[tabela].findIndex(x => String(x.id) === String(id)); if (i >= 0) S[tabela][i] = {...S[tabela][i], ...obj}; }
  else S[tabela].push(r);
  return r;
}
async function excluir(tabela, id){
  await api('delete', {sheet:tabela, id});
  S[tabela] = S[tabela].filter(x => String(x.id) !== String(id));
}

/* ============ CÁLCULOS ============ */
const ingrediente = nome => S.Ingredientes.find(i => i.nome === nome);
const receita = nome => S.Receitas.find(r => r.nome === nome);
const local = nome => S.Locais.find(l => l.nome === nome);
const custoIng = i => i && num(i.qtd_embalagem) ? num(i.preco_embalagem) / num(i.qtd_embalagem) : 0;
const itensDe = rec => S.ReceitaItens.filter(x => x.receita === rec);
const custoForma = rec => itensDe(rec).reduce((s, x) => s + num(x.quantidade) * custoIng(ingrediente(x.ingrediente)), 0);
const adicional = aplic => S.CustosAdicionais.filter(c => ativo(c) && c.aplicacao === aplic && num(c.qtd_pacote))
  .reduce((s, c) => s + num(c.preco_pacote) / num(c.qtd_pacote), 0);
const rendPadrao = rec => num((receita(rec) || {}).rendimento_padrao) || num(S.config.rendimento_padrao) || 16;
const custoUnit = (rec, rend) => { const r = num(rend) || rendPadrao(rec); return (custoForma(rec) + adicional('Por fornada')) / r + adicional('Por unidade'); };

/* ---- Lotes (cada fornada é um lote, com o custo gravado no dia da produção) ---- */
const loteDe = id => id ? S.Fornadas.find(f => String(f.id) === String(id)) : null;
const nomeLote = f => f ? 'Lote ' + (num(f.lote) || '?') : '';
const proximoLote = () => S.Fornadas.reduce((m, f) => Math.max(m, num(f.lote)), 0) + 1;
function custoLote(rec, rend){
  const ci = custoForma(rec), ca = adicional('Por fornada'), r = num(rend) || rendPadrao(rec);
  return { custo_ingredientes:r2(ci), custo_adicional:r2(ca), custo_total:r2(ci + ca), custo_unitario: r ? Math.round((ci + ca) / r * 10000) / 10000 : 0 };
}
function resumoLote(f){
  const vs = S.Vendas.filter(v => String(v.lote) === String(f.id));
  const prod = num(f.rendimento_real), vend = soma(vs,'quantidade'), perd = num(f.perdas);
  const cu = num(f.custo_unitario) || (prod ? num(f.custo_total) / prod : 0);
  const rest = Math.max(prod - vend - perd, 0);
  const vendido = soma(vs,'valor'), custoVend = soma(vs,'custo_preparo'), repasse = soma(vs,'repasse'), reserva = soma(vs,'reserva');
  const custoPerdas = r2(perd * cu);
  return { vs, prod, vend, perd, rest, cu, custo:num(f.custo_total), vendido, recebido:soma(vs.filter(v => v.status === 'Pago'),'valor'),
    custoVend, repasse, reserva, custoPerdas, lucro: r2(soma(vs,'lucro_disponivel') - custoPerdas), estoque: r2(rest * cu) };
}
const lotesDe = rec => S.Fornadas.filter(f => f.receita === rec).sort((a,b) => String(b.data).localeCompare(String(a.data)) || num(b.lote) - num(a.lote));
function loteSugerido(rec){ const ls = lotesDe(rec); return ls.find(f => resumoLote(f).rest > 0) || ls[0] || null; }

function calcVenda(v){
  const f = loteDe(v.lote);
  const unit = f && num(f.custo_unitario) ? num(f.custo_unitario) + adicional('Por unidade') : custoUnit(v.receita, v.rendimento);
  const custo = num(v.quantidade) * unit + adicional('Por pedido');
  const valor = num(v.valor);
  const repasse = valor * pct((local(v.local) || {}).repasse_percentual);
  const reserva = S.config.regra_reserva === 'percentual' ? valor * pct(S.config.reserva_percentual) : custo;
  return { custo_preparo:r2(custo), repasse:r2(repasse), reserva:r2(reserva), lucro_disponivel:r2(valor - custo - repasse - reserva) };
}
function precosDe(rec){ return S.Precos.filter(p => p.receita === rec && ativo(p) && num(p.quantidade) > 0).sort((a,b) => num(b.quantidade) - num(a.quantidade)); }
function valorAuto(rec, qtd){
  const ps = precosDe(rec); let n = qtd, total = 0; const partes = [];
  for (const p of ps){ const k = Math.floor(n / num(p.quantidade)); if (k > 0){ total += k * num(p.preco); n -= k * num(p.quantidade); partes.push((k > 1 ? k + '× ' : '') + p.descricao); } }
  return n === 0 && ps.length ? {valor:r2(total), combo:partes.join(' + ')} : null;
}
const vendasMes = () => S.Vendas.filter(v => String(v.data).slice(0,7) === S.mes);

function rota(){
  const h = (location.hash.slice(1) || 'inicio').split('/');
  const base = h[0];
  document.querySelectorAll('[data-r]').forEach(a => {
    const r = a.dataset.r; a.classList.toggle('on', r === base || (r === 'mais' && ['cad','itens','config','lotes'].includes(base)));
  });
  $('#fab').hidden = !['inicio','vendas'].includes(base);
  const v = $('#view');
  try{
    if (base === 'inicio') v.innerHTML = telaInicio();
    else if (base === 'vendas') v.innerHTML = telaVendas();
    else if (base === 'receber') v.innerHTML = telaReceber();
    else if (base === 'repasses') v.innerHTML = telaRepasses();
    else if (base === 'mais') v.innerHTML = telaMais();
    else if (base === 'cad') v.innerHTML = telaCadastro(decodeURIComponent(h[1]));
    else if (base === 'itens') v.innerHTML = telaItens(decodeURIComponent(h[1]));
    else if (base === 'config') v.innerHTML = telaConfig();
    else if (base === 'lotes') v.innerHTML = telaLotes();
    else v.innerHTML = telaInicio();
  }catch(e){ console.error(e); v.innerHTML = `<div class="panel vazio"><b>Algo deu errado nesta tela</b>${esc(e.message)}</div>`; }
  ligar(base);
}

/* ============ TELA: PAINEL ============ */
const diasEntre = (a, b) => { const p = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); };
const fimMes = m => { const [a,mm] = m.split('-').map(Number); return m + '-' + String(new Date(a, mm, 0).getDate()).padStart(2,'0'); };
const mesCurto = m => { const [a,mm] = m.split('-').map(Number); return new Date(a, mm - 1, 1).toLocaleDateString('pt-BR', {month:'short'}).replace('.', ''); };
const dataLonga = s => s ? `${String(s).slice(8,10)}/${String(s).slice(5,7)}/${String(s).slice(0,4)}` : '';
const vendasDoMes = m => S.Vendas.filter(v => String(v.data).slice(0,7) === m);
const pctTxt = (x, c = 0) => ((Number.isFinite(x) ? x : 0) * 100).toLocaleString('pt-BR', {minimumFractionDigits:c, maximumFractionDigits:c}) + '%';
const brlCurto = v => Math.abs(v) >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil' : brl(v).replace(',00', '');
const precoAvulso = rec => num((S.Precos.find(p => p.receita === rec && ativo(p) && num(p.quantidade) === 1) || {}).preco);
const vazioP = t => `<p class="muted" style="margin:0;font-size:14px">${t}</p>`;
const notaP = t => `<p class="muted" style="margin:10px 0 0;font-size:13px">${t}</p>`;
const subP = t => `<p class="muted" style="margin:-6px 0 10px;font-size:13px">${t}</p>`;
const juntar = (...ps) => { const x = ps.filter(Boolean); return !x.length ? '' : x.length === 1 ? x[0] : `<div class="grid g2">${x.join('')}</div>`; };
const PALETA = ['var(--caramelo)', 'var(--ninho)', 'var(--ok)', 'var(--erro)'];

function numeros(vs){
  const vendido = soma(vs,'valor'), luc = soma(vs,'lucro_disponivel'), un = soma(vs,'quantidade');
  return { vendido, luc, un, n:vs.length, custo:soma(vs,'custo_preparo'), rep:soma(vs,'repasse'), res:soma(vs,'reserva'),
    margem: vendido ? luc / vendido : 0, ticket: vs.length ? vendido / vs.length : 0, porUn: un ? vendido / un : 0 };
}
function delta(at, ant, mAnt, pp){
  const rot = ' vs ' + mesCurto(mAnt);
  if (pp){ const d = (at - ant) * 100; if (Math.abs(d) < 0.05) return `<small class="delta">igual${rot}</small>`;
    return `<small class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString('pt-BR', {maximumFractionDigits:1})} p.p.${rot}</small>`; }
  if (!ant) return at ? `<small class="delta">sem vendas em ${mesCurto(mAnt)}</small>` : '';
  const d = (at - ant) / Math.abs(ant);
  if (Math.abs(d) < 0.005) return `<small class="delta">igual${rot}</small>`;
  return `<small class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${pctTxt(Math.abs(d))}${rot}</small>`;
}
function hbars(linhas, cor){
  const max = Math.max(...linhas.map(l => l.v), 0.0001);
  return `<div class="hbars">${linhas.map(l => `<div class="hb"><span class="hb-l" title="${esc(l.t)}">${esc(l.t)}</span>
    <div class="hb-t"><div style="width:${(Math.max(l.v, 0) / max * 100).toFixed(1)}%${cor || l.cor ? ';background:' + (l.cor || cor) : ''}"></div></div><b class="num">${l.f ?? brl(l.v)}</b></div>`).join('')}</div>`;
}

/* ---- gráficos em SVG ---- */
function svgMensal(ds){
  const W = 640, H = 240, pt = 26, pb = 30, pl = 4, pr = 4, n = ds.length;
  const max = Math.max(...ds.map(d => Math.max(d.vend, d.luc)), 1);
  const y = v => pt + (H - pt - pb) * (1 - Math.max(v, 0) / max);
  const gw = (W - pl - pr) / n, bw = Math.min(28, gw * .34);
  let g = [0.5, 1].map(k => `<line x1="${pl}" x2="${W - pr}" y1="${y(max * k)}" y2="${y(max * k)}" class="g-grade"/><text x="${pl}" y="${y(max * k) - 6}" class="g-txt">${brlCurto(max * k)}</text>`).join('')
    + `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="g-eixo"/>`;
  ds.forEach((d, i) => {
    const cx = pl + gw * i + gw / 2, sel = d.m === S.mes;
    g += `<g${sel ? '' : ' opacity=".5"'}><rect x="${cx - bw - 1.5}" y="${y(d.vend)}" width="${bw}" height="${y(0) - y(d.vend)}" rx="4" class="g-vend"><title>${nomeMes(d.m)}: vendido ${brl(d.vend)}</title></rect>
      <rect x="${cx + 1.5}" y="${y(d.luc)}" width="${bw}" height="${y(0) - y(d.luc)}" rx="4" class="g-luc"><title>${nomeMes(d.m)}: lucro ${brl(d.luc)}</title></rect></g>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" class="g-txt${sel ? ' g-sel' : ''}">${mesCurto(d.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Vendido e lucro mês a mês">${g}</svg>`;
}
function svgCustoLotes(ls){
  const W = 640, H = 240, pt = 26, pb = 30, pl = 4, pr = 4;
  const vals = ls.map(f => num(f.custo_unitario));
  let mn = Math.min(...vals), mx = Math.max(...vals); const pad = (mx - mn) * .2 || mx * .1 || 1; mn = Math.max(0, mn - pad); mx += pad;
  const n = ls.length, x = i => n === 1 ? W / 2 : pl + 30 + (W - pl - pr - 50) * i / (n - 1), y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const recs = [...new Set(ls.map(f => f.receita))];
  let g = [0, .5, 1].map(k => { const v = mn + (mx - mn) * k; return `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="g-grade"/>${k ? `<text x="${pl}" y="${y(v) - 6}" class="g-txt">${brl(v)}</text>` : ''}`; }).join('');
  recs.forEach((r, ri) => {
    const pts = ls.map((f, i) => ({f, i})).filter(p => p.f.receita === r), cor = PALETA[ri % PALETA.length];
    if (pts.length > 1) g += `<polyline points="${pts.map(p => `${x(p.i)},${y(num(p.f.custo_unitario))}`).join(' ')}" fill="none" stroke="${cor}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += pts.map(p => `<circle cx="${x(p.i)}" cy="${y(num(p.f.custo_unitario))}" r="5.5" fill="${cor}" stroke="var(--surface)" stroke-width="2"><title>${nomeLote(p.f)} · ${esc(r)} · ${dataBR(p.f.data)}: ${brl(p.f.custo_unitario)} por unidade</title></circle>`).join('');
  });
  g += ls.map((f, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="g-txt">L${num(f.lote)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Custo por unidade em cada lote">${g}</svg>
    <div class="leg-mini" style="margin-top:6px">${recs.map((r, i) => `<span><i style="background:${PALETA[i % PALETA.length]}"></i>${esc(r)}</span>`).join('')}</div>`;
}

/* ---- blocos do painel ---- */
function pEvolucao(){
  if (!S.Vendas.length) return '';
  const primeiro = S.Vendas.map(v => String(v.data).slice(0,7)).sort()[0];
  const ms = []; for (let i = 11; i >= 0; i--){ const m = somaMes(S.mes, -i); if (m >= primeiro) ms.push(m); }
  if (!ms.length) return '';
  const ds = ms.map(m => { const x = numeros(vendasDoMes(m)); return {m, vend:x.vendido, luc:x.luc}; });
  return `<section class="panel"><div class="grupo-top"><h2 style="margin:0">Evolução mês a mês</h2>
    <div class="leg-mini"><span><i style="background:var(--caramelo)"></i>Vendido</span><span><i style="background:#7FB08A"></i>Lucro</span></div></div>${svgMensal(ds)}</section>`;
}
function pDestino(A){
  if (!A.vendido) return '';
  const w = x => Math.max(x, 0) / Math.max(A.vendido, 0.01);
  return `<section class="panel"><h2>Para onde vai cada real vendido</h2>
    <div class="barra" role="img" aria-label="Divisão do valor vendido"><div class="seg-custo" style="flex-grow:${w(A.custo)}"></div><div class="seg-repasse" style="flex-grow:${w(A.rep)}"></div>
      <div class="seg-reserva" style="flex-grow:${w(A.res)}"></div><div class="seg-lucro" style="flex-grow:${w(A.luc)}"></div></div>
    <div class="legenda l2">
      <div><i class="seg-custo"></i><span><b class="num">${brl(A.custo)}</b><small>Reposição dos ingredientes</small></span></div>

function telaInicio(){
  const passos = [
    {ok:S.Ingredientes.length, t:'Cadastre os ingredientes', link:'#cad/Ingredientes'},
    {ok:S.Receitas.length, t:'Crie as receitas e o rendimento', link:'#cad/Receitas'},
    {ok:S.ReceitaItens.length, t:'Informe os ingredientes de cada receita', link:'#cad/Receitas'},
    {ok:S.Precos.length, t:'Defina preços e combos', link:'#cad/Precos'},
    {ok:S.Locais.length, t:'Cadastre os locais de venda e o repasse', link:'#cad/Locais'},
    {ok:S.config.regra_reserva, t:'Ajuste reserva e meta mensal', link:'#config'},
  ];
  const inicio = passos.some(p => !p.ok) ? `<section class="panel"><h2>Primeiros passos</h2>
    <p class="muted" style="margin:0">Preencha os cadastros na ordem abaixo. Com eles, o app calcula sozinho o custo, o repasse e o lucro de cada venda.</p>
    <ol class="passos">${passos.map(p => `<li class="${p.ok ? 'feito' : ''}"><span>${p.t}</span><a class="btn" href="${p.link}">${p.ok ? 'Revisar' : 'Abrir'}</a></li>`).join('')}</ol></section>` : '';

  const mAnt = somaMes(S.mes, -1), vm = vendasDoMes(S.mes), A = numeros(vm), B = numeros(vendasDoMes(mAnt));
  const pend = S.Vendas.filter(v => v.status !== 'Pago'), aRec = soma(pend,'valor'), velhas = pend.filter(v => diasEntre(v.data, hoje()) > 30).length;
  const kpis = `<div class="kpis k6">
    <div class="kpi"><span>Vendido</span><b class="num">${brl(A.vendido)}</b>${delta(A.vendido, B.vendido, mAnt)}</div>
    <div class="kpi lucro"><span>Lucro disponível</span><b class="num">${brl(A.luc)}</b>${delta(A.luc, B.luc, mAnt)}</div>
    <div class="kpi"><span>Margem de lucro</span><b class="num">${pctTxt(A.margem, 1)}</b>${A.vendido && B.vendido ? delta(A.margem, B.margem, mAnt, true) : ''}</div>
    <div class="kpi"><span>Unidades vendidas</span><b class="num">${A.un}</b>${delta(A.un, B.un, mAnt)}</div>
    <div class="kpi"><span>Ticket médio</span><b class="num">${brl(A.ticket)}</b><small class="delta">${A.un ? brl(A.porUn) + ' por unidade' : ''}</small></div>
    <div class="kpi"><span>A receber (todos os meses)</span><b class="num">${brl(aRec)}</b><small class="delta ${velhas ? 'down' : ''}">${pend.length ? `${pend.length} ${pend.length === 1 ? 'venda' : 'vendas'}${velhas ? ` · ${velhas} há mais de 30 dias` : ''}` : 'Nada pendente'}</small></div></div>`;

  const vendasMesHTML = vm.length ? [juntar(pMeta(A), pReceitas(vm)), juntar(pLocais(vm), pCombo(vm)), juntar(pSemana(), pPagamentos(vm))].join('')
    : `<section class="panel">${vazioP(`Nenhuma venda em ${nomeMes(S.mes)}. Registre a primeira com o botão “Nova venda”.`)}</section>`;
  const blocos = [
    ['Cobrança e clientes', juntar(pAtraso(pend), pRanking()) + pSumidos()],
    ['Produção e lotes', juntar(pEstoque(), pProducao()) + pCustoLotes()],
    ['Compras e custos', juntar(pPesoIngredientes(), pGastos()) + pRetorno()],
  ].filter(b => b[1]).map(([t, h]) => `<div class="secao" style="margin:12px 0 0">${t}</div>${h}`).join('');

  return `<div class="head"><div><h1>Painel</h1><p class="sub">${A.un} ${A.un === 1 ? 'unidade' : 'unidades'} em ${A.n} ${A.n === 1 ? 'venda' : 'vendas'}</p></div>${seletorMes()}</div>
  <div class="stack">${inicio}${kpis}${pEvolucao()}${juntar(pDestino(A), pCaixa())}${vendasMesHTML}${blocos}</div>`;
}

/* ============ TELA: VENDAS ============ */
function telaVendas(){
  let vs = vendasMes();
  if (S.filtroStatus === 'pendente') vs = vs.filter(v => v.status !== 'Pago');
  if (S.filtroStatus === 'pago') vs = vs.filter(v => v.status === 'Pago');
  if (S.filtroLocal) vs = vs.filter(v => v.local === S.filtroLocal);
  vs.sort((a,b) => String(b.data).localeCompare(String(a.data)));
  const chip = (k, t) => `<button class="chip ${S.filtroStatus === k ? 'on' : ''}" data-fs="${k}">${t}</button>`;
  return `<div class="head"><div><h1>Vendas</h1><p class="sub">${vs.length} ${vs.length === 1 ? 'registro' : 'registros'} · ${brl(soma(vs,'valor'))}</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${seletorMes()}<button class="btn pri so-desk" data-nova>${I.mais1} Nova venda</button></div></div>
  <div class="filtros"><div class="chips">${chip('todas','Todas')}${chip('pendente','Pendentes')}${chip('pago','Pagas')}</div>
    <select data-fl aria-label="Filtrar por local"><option value="">Todos os locais</option>${S.Locais.map(l => `<option ${S.filtroLocal === l.nome ? 'selected' : ''}>${esc(l.nome)}</option>`).join('')}</select></div>
  <section class="panel">${vs.length ? `<div class="lista">${vs.map(v => `
    <button class="item" data-venda="${esc(v.id)}"><div class="t"><b>${esc(v.cliente || 'Sem nome')}</b>
      <small>${dataBR(v.data)} · ${num(v.quantidade)} ${esc(v.receita || '')}${v.combo ? ' · ' + esc(v.combo) : ''}${v.local ? ' · ' + esc(v.local) : ''}${loteDe(v.lote) ? ' · ' + nomeLote(loteDe(v.lote)) : ''}</small></div>
      <div class="v"><b class="num">${brl(v.valor)}</b><span class="badge ${v.status === 'Pago' ? 'b-ok' : 'b-warn'}">${v.status === 'Pago' ? 'Pago' : 'Pendente'}</span></div></button>`).join('')}</div>`
    : `<div class="vazio"><b>Nenhuma venda aqui</b>Mude o mês ou os filtros, ou registre uma nova venda.</div>`}</section>`;
}

function formVenda(id){
  if (!S.Receitas.length){ toast('Cadastre ao menos uma receita antes de vender.', true); location.hash = '#cad/Receitas'; return; }
  const v = id ? {...S.Vendas.find(x => String(x.id) === String(id))} : {data:hoje(), quantidade:1, receita:S.Receitas.filter(ativo)[0]?.nome || S.Receitas[0].nome, status:'Pendente', forma_pagamento:'Pix'};
  let valorManual = !!id;
  const opts = (arr, sel) => arr.map(n => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const m = abrirModal(id ? 'Editar venda' : 'Nova venda', `
    <div class="duas"><div class="campo"><label for="v_data">Data</label><input type="date" id="v_data" value="${esc(v.data)}"></div>
      <div class="campo"><label for="v_cliente">Cliente</label><input id="v_cliente" list="dl_cli" value="${esc(v.cliente || '')}" autocomplete="off">
      <datalist id="dl_cli">${S.Clientes.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist></div></div>
    <div class="campo"><label>Receita</label><div class="chips" id="v_rec">${S.Receitas.filter(r => ativo(r) || r.nome === v.receita).map(r => `<button type="button" class="chip ${r.nome === v.receita ? 'on' : ''}" data-rec="${esc(r.nome)}">${esc(r.nome)}</button>`).join('')}</div></div>
    <div class="campo"><label>Preço / combo</label><div class="chips" id="v_precos"></div></div>
    <div class="duas"><div class="campo"><label for="v_qtd">Quantidade</label><div class="stepper"><button type="button" data-q="-1" aria-label="Menos">−</button><input id="v_qtd" type="number" min="1" inputmode="numeric" value="${num(v.quantidade) || 1}"><button type="button" data-q="1" aria-label="Mais">+</button></div></div>
      <div class="campo"><label for="v_valor">Valor (R$)</label><input id="v_valor" type="number" step="0.01" inputmode="decimal" value="${v.valor ?? ''}"></div></div>
    <div class="duas"><div class="campo"><label for="v_local">Local</label><select id="v_local"><option value="">—</option>${opts(S.Locais.map(l => l.nome), v.local)}</select></div>
      <div class="campo"><label for="v_lotebtn">Lote</label><button type="button" class="lote-campo" id="v_lotebtn"></button><input type="hidden" id="v_lote"></div></div>
    <div class="campo" id="v_rendbox"><label for="v_rend">Rendimento da fornada</label><input id="v_rend" type="number" inputmode="numeric" placeholder="Padrão" value="${v.rendimento || ''}"></div>
    <div class="campo"><label>Pagamento</label><div class="seg" id="v_status"><button type="button" data-st="Pendente">Pendente</button><button type="button" data-st="Pago">Pago</button></div></div>
    <div class="duas" id="v_pago"><div class="campo"><label for="v_forma">Forma</label><select id="v_forma">${opts(['Pix','Dinheiro','Cartão'], v.forma_pagamento)}</select></div>
      <div class="campo"><label for="v_dpag">Data do pagamento</label><input type="date" id="v_dpag" value="${esc(v.data_pagamento || hoje())}"></div></div>
    <input type="hidden" id="v_combo" value="${esc(v.combo || '')}">
    <div class="campo"><label for="v_obs">Observação</label><input id="v_obs" value="${esc(v.observacao || '')}"></div>
    <div class="previa num" id="v_prev"></div>`,
    {salvar:'Salvar venda', excluir: !!id});

  const q = s => m.querySelector(s);
  let st = v.status === 'Pago' ? 'Pago' : 'Pendente';
  const loteSel = () => loteDe(q('#v_lote').value);
  const lerV = () => ({ data:q('#v_data').value, cliente:q('#v_cliente').value.trim(), receita:v.receita, quantidade:num(q('#v_qtd').value),
    lote: loteSel() ? loteSel().id : '',
    rendimento: loteSel() ? num(loteSel().rendimento_real) : (q('#v_rend').value ? num(q('#v_rend').value) : ''), combo:q('#v_combo').value, valor:num(q('#v_valor').value),
    local:q('#v_local').value, status:st, forma_pagamento: st === 'Pago' ? q('#v_forma').value : '',
    data_pagamento: st === 'Pago' ? q('#v_dpag').value : '', observacao:q('#v_obs').value.trim() });
  const prev = () => {
    const c = calcVenda(lerV());
    q('#v_prev').innerHTML = `<span>Custo de preparo</span><b>${brl(c.custo_preparo)}</b><span>Repasse</span><b>${brl(c.repasse)}</b>
      <span>Reserva</span><b>${brl(c.reserva)}</b><div class="tot"><span>Lucro disponível</span><span>${brl(c.lucro_disponivel)}</span></div>${avisoLote()}`;
  };
  const avisoLote = () => {
    const f = loteSel(); if (!f) return '';
    const rest = resumoLote(f).rest + (id && String(v.lote) === String(f.id) ? num(v.quantidade) : 0);
    return num(q('#v_qtd').value) > rest ? `<div class="alerta">${nomeLote(f)} tem só ${rest} ${rest === 1 ? 'unidade restante' : 'unidades restantes'}.</div>` : '';
  };
  /* ---- Lote: escolha em janela própria ---- */
  let loteOk = !!id;
  const lotesAbertos = () => lotesDe(v.receita).filter(f => resumoLote(f).rest > 0);
  const desenharLoteBtn = () => {
    const f = loteSel(), b = q('#v_lotebtn');
    let t = 'Sem lote (preço atual)';
    if (f){ const rest = resumoLote(f).rest + (id && String(v.lote) === String(f.id) ? num(v.quantidade) : 0); t = `${nomeLote(f)} · ${dataBR(f.data)} · ${rest} ${rest === 1 ? 'resta' : 'restam'}`; }
    b.innerHTML = esc(t) + (loteOk ? '' : '<small>Toque para confirmar o lote</small>');
    b.classList.toggle('pendente', !loteOk);
    q('#v_rendbox').style.display = f ? 'none' : '';
  };
  const setLote = (lid, confirmado) => { q('#v_lote').value = lid || ''; loteOk = confirmado; desenharLoteBtn(); prev(); };
  const iniciarLote = () => {
    const ab = lotesAbertos();
    q('#v_lote').value = ab[0]?.id || loteSugerido(v.receita)?.id || '';
    loteOk = ab.length < 2;        // com 2 ou mais lotes em venda, pergunta de qual saiu
    desenharLoteBtn();
  };
  const abrirPicker = depois => {
    const sel = q('#v_lote').value; let todos = false;
    const div = document.createElement('div'); div.className = 'picker'; div.setAttribute('role', 'dialog'); div.setAttribute('aria-label', 'Escolher lote');
    m.appendChild(div);
    const desenhar = () => {
      const tudo = lotesDe(v.receita);
      const ls = tudo.filter(f => todos || resumoLote(f).rest > 0 || String(f.id) === String(sel));
      const fechados = tudo.length - ls.length;
      div.innerHTML = `<h2>De qual lote saiu esta venda?</h2>
        <p class="muted" style="margin:0 0 14px;font-size:14px">${esc(v.receita)} · ${num(q('#v_qtd').value)} ${num(q('#v_qtd').value) === 1 ? 'unidade' : 'unidades'}</p>
        ${ls.map((f, i) => { const r = resumoLote(f);
          const tag = ls.length > 1 ? (i === 0 ? '<span class="badge b-ok">mais recente</span>' : i === ls.length - 1 ? '<span class="badge b-warn">mais antigo</span>' : '') : '';
          return `<button type="button" class="lote-op ${String(f.id) === String(sel) && loteOk ? 'on' : ''}" data-pl="${esc(f.id)}"><span><b>${nomeLote(f)} · feito em ${dataBR(f.data)}</b>
            <small>${r.rest} ${r.rest === 1 ? 'unidade restante' : 'unidades restantes'} · custo ${brl(r.cu)} por unidade</small></span>${tag}</button>`; }).join('')}
        ${!todos && fechados ? `<button type="button" class="btn" data-todos style="width:100%;margin-bottom:8px">Mostrar ${fechados === 1 ? '1 lote encerrado' : fechados + ' lotes encerrados'}</button>` : ''}
        <button type="button" class="lote-op ${!sel && loteOk ? 'on' : ''}" data-pl=""><span><b>Sem lote</b><small>Usa o preço atual dos ingredientes</small></span></button>
        <div style="margin-top:auto;padding-top:12px"><button type="button" class="btn" data-pvoltar style="width:100%">Voltar</button></div>`;
    };
    desenhar();
    div.onclick = e => {
      if (e.target.closest('[data-todos]')){ todos = true; desenhar(); return; }
      if (e.target.closest('[data-pvoltar]')){ div.remove(); return; }
      const b = e.target.closest('[data-pl]'); if (!b) return;
      setLote(b.dataset.pl, true); div.remove(); if (depois) depois();
    };
  };
  if (id) q('#v_lote').value = v.lote || '';
  if (id) desenharLoteBtn(); else iniciarLote();
  q('#v_lotebtn').onclick = () => abrirPicker();
  const auto = () => { if (valorManual) return; const a = valorAuto(v.receita, num(q('#v_qtd').value)); if (a){ q('#v_valor').value = a.valor; q('#v_combo').value = a.combo; } prev(); };
  const desenharPrecos = () => {
    const ps = precosDe(v.receita);
    q('#v_precos').innerHTML = ps.length ? ps.map(p => `<button type="button" class="chip" data-p="${esc(p.id)}">${esc(p.descricao)} · ${brl(p.preco)}</button>`).join('')
      : `<span class="muted" style="font-size:13px">Sem preços cadastrados para esta receita. <a href="#cad/Precos">Cadastrar</a></span>`;
  };
  const desenharStatus = () => { q('#v_status').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.st === st)); q('#v_pago').style.display = st === 'Pago' ? '' : 'none'; };
  desenharPrecos(); desenharStatus(); if (!id) auto(); else prev();

  q('#v_rec').onclick = e => { const b = e.target.closest('[data-rec]'); if (!b) return; v.receita = b.dataset.rec;
    q('#v_rec').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); desenharPrecos(); iniciarLote(); valorManual = false; auto(); };
  q('#v_precos').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; const p = S.Precos.find(x => String(x.id) === b.dataset.p);
    q('#v_qtd').value = num(p.quantidade); q('#v_valor').value = num(p.preco); q('#v_combo').value = p.descricao; valorManual = false; prev(); };
  m.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { q('#v_qtd').value = Math.max(1, num(q('#v_qtd').value) + num(b.dataset.q)); valorManual = false; auto(); });
  q('#v_qtd').oninput = () => { valorManual = false; auto(); };
  q('#v_valor').oninput = () => { valorManual = true; q('#v_combo').value = ''; prev(); };
  ['#v_local','#v_rend'].forEach(s => q(s).oninput = prev);
  q('#v_cliente').onchange = () => { const c = S.Clientes.find(x => x.nome === q('#v_cliente').value.trim()); if (c && c.local_padrao && !q('#v_local').value){ q('#v_local').value = c.local_padrao; prev(); } };
  q('#v_status').onclick = e => { const b = e.target.closest('[data-st]'); if (b){ st = b.dataset.st; desenharStatus(); } };

  m.onSalvar = async () => {
    const d = lerV();
    if (!d.cliente) throw new Error('Informe o nome do cliente.');
    if (!(d.quantidade > 0)) throw new Error('Informe a quantidade.');
    if (!(d.valor >= 0)) throw new Error('Informe o valor.');
    if (!loteOk){ abrirPicker(() => m.querySelector('[data-ok]').click()); const e = new Error('Escolha o lote'); e.silencioso = true; throw e; }
    Object.assign(d, calcVenda(d));
    await salvar('Vendas', d, id);
    if (!S.Clientes.some(c => c.nome.toLowerCase() === d.cliente.toLowerCase())){
      salvar('Clientes', {nome:d.cliente, local_padrao:d.local}).catch(() => {});
    }
    toast(id ? 'Venda atualizada' : 'Venda salva');
  };
  m.onExcluir = async () => { await excluir('Vendas', id); toast('Venda excluída'); };
}

/* ============ TELA: A RECEBER ============ */
function telaReceber(){
  const pend = S.Vendas.filter(v => v.status !== 'Pago');
  const grupos = {};
  pend.forEach(v => (grupos[v.cliente || 'Sem nome'] ||= []).push(v));
  const nomes = Object.keys(grupos).sort((a,b) => soma(grupos[b],'valor') - soma(grupos[a],'valor'));
  return `<div class="head"><div><h1>A receber</h1><p class="sub">${brl(soma(pend,'valor'))} de ${nomes.length} ${nomes.length === 1 ? 'cliente' : 'clientes'}, considerando todos os meses</p></div></div>
  <section class="panel">${nomes.length ? nomes.map(n => {
    const vs = grupos[n]; const tot = soma(vs,'valor'); const cli = S.Clientes.find(c => c.nome === n);
    const fone = cli && String(cli.telefone || '').replace(/\D/g,'');
    return `<div class="grupo"><div class="grupo-top"><b>${esc(n)}</b><b class="num">${brl(tot)}</b></div>
      <div class="muted" style="font-size:13px;margin-top:4px">${vs.map(v => `${dataBR(v.data)}: ${num(v.quantidade)} ${esc(v.receita)} (${brl(v.valor)})`).join(' · ')}</div>
      <div class="acoes"><button class="btn" data-pagar="${esc(n)}" data-forma="Pix">Recebi no Pix</button><button class="btn" data-pagar="${esc(n)}" data-forma="Dinheiro">Recebi em dinheiro</button>
      ${fone ? `<a class="btn zap" target="_blank" rel="noopener" href="https://wa.me/${fone.length <= 11 ? '55' + fone : fone}?text=${encodeURIComponent(msgCobranca(n, tot))}">${I.zap} Cobrar</a>` : `<a class="btn" href="#cad/Clientes">Adicionar telefone</a>`}</div></div>`;
  }).join('') : `<div class="vazio"><b>Nada pendente</b>Todas as vendas registradas estão pagas.</div>`}</section>`;
}
function msgCobranca(nome, valor){
  const t = S.config.mensagem_cobranca || 'Oi, {nome}! Tudo bem? Passando para lembrar do pagamento da palha italiana: {valor}. Pode ser no Pix. Obrigado!';
  return t.replace(/\{nome\}/g, nome.split(' ')[0]).replace(/\{valor\}/g, brl(valor));
}

/* ============ TELA: REPASSES ============ */
function telaRepasses(){
  const locs = S.Locais.filter(l => pct(l.repasse_percentual) > 0);
  if (!locs.length) return `<div class="head"><div><h1>Repasses</h1></div></div><section class="panel vazio"><b>Nenhum local com repasse</b>Cadastre o local e o percentual (por exemplo, Núcleo com 20%).<div style="margin-top:14px"><a class="btn pri" href="#cad/Locais">Abrir locais</a></div></section>`;
  const cards = locs.map(l => {
    const devido = soma(S.Vendas.filter(v => v.local === l.nome),'repasse');
    const feito = soma(S.Repasses.filter(r => r.local === l.nome),'valor');
    const doMes = soma(vendasMes().filter(v => v.local === l.nome),'repasse');
    const saldo = r2(devido - feito);
    return `<section class="panel"><div class="grupo-top"><h2 style="margin:0">${esc(l.nome)}</h2><span class="badge ${saldo > 0 ? 'b-warn' : 'b-ok'}">${saldo > 0 ? 'Saldo em aberto' : 'Em dia'}</span></div>
      <table style="margin-top:10px"><tbody>
        <tr><td>Repasse de ${nomeMes(S.mes)} (${Math.round(pct(l.repasse_percentual)*100)}%)</td><td class="r num">${brl(doMes)}</td></tr>
        <tr><td>Total devido, todos os meses</td><td class="r num">${brl(devido)}</td></tr>
        <tr><td>Já repassado</td><td class="r num">${brl(feito)}</td></tr>
        <tr><td><b>Saldo a repassar</b></td><td class="r num"><b>${brl(saldo)}</b></td></tr></tbody></table>
      <div class="acoes"><button class="btn pri" data-repassar="${esc(l.nome)}" data-saldo="${Math.max(saldo,0)}">Registrar repasse</button></div></section>`;
  }).join('');
  const hist = [...S.Repasses].sort((a,b) => String(b.data).localeCompare(String(a.data)));
  return `<div class="head"><div><h1>Repasses</h1><p class="sub">Valores devidos aos locais de venda</p></div>${seletorMes()}</div>
  <div class="grid g2">${cards}</div>

/* ============ COMPRA ATUALIZA O PREÇO DO INGREDIENTE ============ */
async function aplicarPrecoCompra(c, id){
  const nome = String(c.ingrediente || '').trim().toLowerCase();
  const i = S.Ingredientes.find(x => String(x.nome).toLowerCase() === nome);
  if (!i) return 'Compra salva. Esse item não está nos ingredientes, então nenhum preço mudou.';
  const maisNova = S.Compras.some(x => String(x.id) !== String(id) && String(x.ingrediente).trim().toLowerCase() === nome && String(x.data) > String(c.data));
  if (maisNova) return `Compra salva. Já existe uma compra mais recente de ${i.nome}; o preço continua o daquela.`;
  const q = num(c.quantidade), emb = num(i.qtd_embalagem), u = c.unidade || 'un', iu = i.unidade || 'g';
  if (!(q > 0) || !(num(c.valor) > 0) || !emb) return `Compra salva. Informe a quantidade para atualizar o preço de ${i.nome}.`;
  const fator = ({g:{g:1, kg:1000}, ml:{ml:1, L:1000}, un:{un:1}})[iu] || {};
  let base = 0;
  if (u === 'pacote' || (u === 'un' && iu !== 'un')) base = q * emb;
  else if (fator[u]) base = q * fator[u];
  if (!base) return `Compra salva. A unidade "${u}" não combina com ${iu}, então o preço de ${i.nome} não mudou.`;
  const novo = r2(num(c.valor) / base * emb), antigo = num(i.preco_embalagem);
  if (novo === r2(antigo)) return `Compra salva. ${i.nome} continua a ${brl(novo)}.`;
  await salvar('Ingredientes', {preco_embalagem:novo, mercado:c.mercado || i.mercado || ''}, i.id);
  return `${i.nome}: ${brl(antigo)} → ${brl(novo)} por ${emb} ${iu}`;
}

/* ============ FORNADA = LOTE ============ */
function formFornada(id){
  if (!S.Receitas.length){ toast('Cadastre ao menos uma receita antes.', true); location.hash = '#cad/Receitas'; return; }
  const f = id ? {...loteDe(id)} : {data:hoje(), receita:S.Receitas.filter(ativo)[0]?.nome || S.Receitas[0].nome, lote:proximoLote()};
  const nomes = S.Receitas.filter(r => ativo(r) || r.nome === f.receita).map(r => r.nome);
  const m = abrirModal(id ? 'Editar ' + nomeLote(f) : 'Nova fornada · Lote ' + f.lote, `
    <div class="duas"><div class="campo"><label for="f_data">Data</label><input type="date" id="f_data" value="${esc(f.data)}"></div>
      <div class="campo"><label for="f_rec">Receita</label><select id="f_rec">${nomes.map(n => `<option ${n === f.receita ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div></div>
    <div class="duas"><div class="campo"><label for="f_rend">Unidades produzidas</label><input id="f_rend" type="number" inputmode="numeric" value="${esc(f.rendimento_real ?? '')}" placeholder="${rendPadrao(f.receita)}"></div>
      <div class="campo"><label for="f_perd">Perdas (unidades)</label><input id="f_perd" type="number" inputmode="numeric" value="${esc(f.perdas ?? '')}" placeholder="0"></div></div>
    ${id ? `<label class="check"><input type="checkbox" id="f_recalc"> Recalcular o custo com os preços de hoje</label>` : ''}
    <div class="campo"><label for="f_obs">Observação</label><input id="f_obs" value="${esc(f.observacao || '')}"></div>
    <div class="previa num" id="f_prev"></div>`, {salvar:'Salvar fornada', excluir:!!id});
  const q = s => m.querySelector(s);
  const ler = () => {
    const rec = q('#f_rec').value, rend = num(q('#f_rend').value) || rendPadrao(rec);
    const atual = !id || (q('#f_recalc') && q('#f_recalc').checked) || rec !== f.receita || !num(f.custo_total);
    const c = atual ? custoLote(rec, rend) : { custo_ingredientes:num(f.custo_ingredientes), custo_adicional:num(f.custo_adicional),
      custo_total:num(f.custo_total), custo_unitario: Math.round(num(f.custo_total) / rend * 10000) / 10000 };
    return { atual, d:{ lote:num(f.lote) || proximoLote(), data:q('#f_data').value, receita:rec, rendimento_real:rend, perdas:num(q('#f_perd').value), observacao:q('#f_obs').value.trim(), ...c } };
  };
  const prev = () => { const {atual, d} = ler();
    q('#f_prev').innerHTML = `<span>Ingredientes</span><b>${brl(d.custo_ingredientes)}</b><span>Custos por fornada</span><b>${brl(d.custo_adicional)}</b>
      <span>Custo do lote</span><b>${brl(d.custo_total)}</b><div class="tot"><span>Custo por unidade (${d.rendimento_real} un)</span><span>${brl(d.custo_unitario)}</span></div>
      <div class="muted" style="grid-column:1/-1;margin-top:4px">${atual ? 'Com os preços de hoje dos ingredientes.' : 'Com os preços gravados quando o lote foi criado.'}</div>`; };
  ['#f_rec','#f_rend','#f_perd','#f_recalc'].forEach(s => { const el = q(s); if (el) el.oninput = el.onchange = prev; });
  prev();
  m.onSalvar = async () => {
    const {d} = ler();
    if (!d.data) throw new Error('Informe a data.');
    if (d.perdas > d.rendimento_real) throw new Error('As perdas não podem passar das unidades produzidas.');
    await salvar('Fornadas', d, id);
    let n = 0;
    if (id) for (const v of S.Vendas.filter(x => String(x.lote) === String(id))){
      const c = calcVenda({...v, rendimento:d.rendimento_real});
      if (c.custo_preparo !== r2(num(v.custo_preparo)) || c.lucro_disponivel !== r2(num(v.lucro_disponivel))){ await salvar('Vendas', {...c, rendimento:d.rendimento_real}, v.id); n++; }
    }
    toast(id ? (n ? `Lote salvo e ${n} ${n === 1 ? 'venda recalculada' : 'vendas recalculadas'}` : 'Lote salvo') : `Lote ${d.lote} criado: ${brl(d.custo_unitario)} por unidade`);
  };
  m.onExcluir = async () => {
    const n = S.Vendas.filter(x => String(x.lote) === String(id)).length;
    if (n) throw new Error(`Este lote tem ${n} ${n === 1 ? 'venda ligada' : 'vendas ligadas'}. Troque o lote dessas vendas antes de excluir.`);
    await excluir('Fornadas', id); toast('Lote excluído');
  };
}

/* ---- Liga vendas antigas e completa fornadas antigas ---- */
function planoAntigos(){
  const fornadas = S.Fornadas.filter(f => !num(f.lote) || !num(f.custo_total)).sort((a,b) => String(a.data).localeCompare(String(b.data)));
  const plano = [], sobra = [];
  S.Vendas.filter(v => !loteDe(v.lote)).forEach(v => {
    const f = S.Fornadas.filter(f => f.receita === v.receita && String(f.data) <= String(v.data))
      .sort((a,b) => String(b.data).localeCompare(String(a.data)) || num(b.lote) - num(a.lote))[0];
    f ? plano.push({v, f}) : sobra.push(v);
  });
  return {fornadas, plano, sobra};
}
function organizarAntigos(){
  const {fornadas, plano, sobra} = planoAntigos();
  const porLote = {}; plano.forEach(({f}) => porLote[f.id] = (porLote[f.id] || 0) + 1);
  const rot = f => num(f.lote) ? nomeLote(f) : `Fornada de ${dataBR(f.data)}`;
  const m = abrirModal('Organizar registros antigos', `
    ${fornadas.length ? `<div class="secao" style="margin:0 0 6px">Fornadas que vão receber número e custo</div>
      <table><tbody>${fornadas.map(f => { const c = num(f.custo_total) ? null : custoLote(f.receita, f.rendimento_real);
        return `<tr><td>${dataBR(f.data)} · ${esc(f.receita)}</td><td class="r num">${c ? brl(c.custo_total) + ' <span class="muted">(preços de hoje)</span>' : 'custo mantido'}</td></tr>`; }).join('')}</tbody></table>` : ''}
    ${plano.length ? `<div class="secao" style="margin:16px 0 6px">Vendas que vão ser ligadas</div>
      <table><tbody>${Object.entries(porLote).map(([fid, n]) => { const f = loteDe(fid);
        return `<tr><td>${rot(f)} · ${esc(f.receita)}</td><td class="r num">${n} ${n === 1 ? 'venda' : 'vendas'}</td></tr>`; }).join('')}</tbody></table>
      <p class="muted" style="font-size:13px;margin:8px 0 0">Cada venda vai para a fornada mais recente da mesma receita feita até a data da venda. Depois, dá para trocar qualquer uma abrindo a venda.</p>` : ''}
    ${sobra.length ? `<p class="alerta" style="margin:12px 0 0">${sobra.length} ${sobra.length === 1 ? 'venda continua' : 'vendas continuam'} sem lote, porque não há fornada da mesma receita registrada antes da data ${sobra.length === 1 ? 'dela' : 'delas'}. Se quiser, registre essa fornada com a data certa e rode de novo.</p>` : ''}
    ${plano.length ? `<label class="check" style="margin-top:14px"><input type="checkbox" id="o_recalc" checked> Recalcular custo, reserva e lucro dessas vendas com o custo do lote</label>` : ''}
    ${!fornadas.length && !plano.length ? '<p class="muted">Nada para organizar.</p>' : ''}`,
    {salvar: 'Organizar'});
  m.onSalvar = async () => {
    const botao = m.querySelector('[data-ok]'); let feitas = 0, total = fornadas.length + plano.length;
    const passo = () => { feitas++; botao.textContent = `Salvando ${feitas} de ${total}…`; };
    for (const f of fornadas){
      const rend = num(f.rendimento_real) || rendPadrao(f.receita);
      const d = { lote: num(f.lote) || proximoLote(), rendimento_real: rend };
      Object.assign(d, num(f.custo_total) ? { custo_unitario: Math.round(num(f.custo_total) / rend * 10000) / 10000 } : custoLote(f.receita, rend));
      await salvar('Fornadas', d, f.id); passo();
    }
    const recalc = m.querySelector('#o_recalc')?.checked;
    for (const {v, f} of plano){
      const d = { lote: f.id };
      if (recalc){ const rend = num(loteDe(f.id).rendimento_real); Object.assign(d, calcVenda({...v, lote:f.id, rendimento:rend}), {rendimento:rend}); }
      await salvar('Vendas', d, v.id); passo();
    }
    toast(`${fornadas.length ? fornadas.length + (fornadas.length === 1 ? ' fornada completada' : ' fornadas completadas') : ''}${fornadas.length && plano.length ? ' e ' : ''}${plano.length ? plano.length + (plano.length === 1 ? ' venda ligada' : ' vendas ligadas') : ''}`);
  };
}

function telaLotes(){
  const filtro = S.filtroLote || 'todos';
  let ls = S.Fornadas.map(f => ({f, r:resumoLote(f)}));
  if (filtro === 'abertos') ls = ls.filter(x => x.r.rest > 0);
  if (filtro === 'encerrados') ls = ls.filter(x => x.r.rest === 0);
  ls.sort((a,b) => String(b.f.data).localeCompare(String(a.f.data)) || num(b.f.lote) - num(a.f.lote));
  const chip = (k, t) => `<button class="chip ${filtro === k ? 'on' : ''}" data-flote="${k}">${t}</button>`;
  const semLote = S.Vendas.filter(v => !loteDe(v.lote)).length;
  const semCusto = S.Fornadas.filter(f => !num(f.lote) || !num(f.custo_total)).length;
  const linha = (t, val, cls = '') => `<tr><td>${t}</td><td class="r num ${cls}">${val}</td></tr>`;
  const card = ({f, r}) => {
    const pv = r.prod ? r.vend / r.prod * 100 : 0, pp = r.prod ? r.perd / r.prod * 100 : 0;
    return `<section class="panel"><div class="grupo-top"><div><b>${nomeLote(f)} · ${esc(f.receita)}</b>
      <div class="muted" style="font-size:13px">${dataBR(f.data)} · custo do lote ${brl(r.custo)} · ${brl(r.cu)} por unidade</div></div>
      <span class="badge ${r.rest > 0 ? 'b-warn' : 'b-ok'}">${r.rest > 0 ? 'Em venda' : 'Encerrado'}</span></div>
      <div class="lote-nums"><div><b class="num">${r.prod}</b><small>Produzidas</small></div><div><b class="num">${r.vend}</b><small>Vendidas</small></div>
        <div><b class="num">${r.perd}</b><small>Perdidas</small></div><div><b class="num">${r.rest}</b><small>Restam</small></div></div>
      <div class="lote-barra" aria-hidden="true"><div class="v" style="width:${pv.toFixed(1)}%"></div><div class="p" style="width:${pp.toFixed(1)}%"></div></div>
      <table><tbody>
        ${linha('Vendido' + (r.vendido - r.recebido > 0.004 ? ` <small class="muted">(${brl(r.vendido - r.recebido)} a receber)</small>` : ''), brl(r.vendido))}
        ${linha('− Custo das unidades vendidas', brl(r.custoVend))}
        ${linha('− Repasse', brl(r.repasse))}
        ${linha('− Reserva da empresa', brl(r.reserva))}
        ${r.perd ? linha(`− Perdas (${r.perd} un)`, brl(r.custoPerdas)) : ''}
        <tr><td><b>Lucro do lote</b></td><td class="r num ${r.lucro < 0 ? 'neg' : ''}"><b>${brl(r.lucro)}</b></td></tr></tbody></table>
      ${r.rest > 0 ? `<p class="muted" style="font-size:13px;margin:8px 0 0">${r.rest} em estoque, que custaram ${brl(r.estoque)}. O lucro cresce conforme forem vendidas.</p>` : ''}
      <div class="acoes"><button class="btn" data-edit="Fornadas" data-id="${esc(f.id)}">Editar lote</button></div></section>`;
  };
  return `<div class="head"><div><a href="#mais" class="muted" style="text-decoration:none;font-weight:600">‹ Mais</a><h1>Lotes</h1>
    <p class="sub">Cada fornada é um lote, com o custo dos ingredientes do dia em que foi feita</p></div>
    <button class="btn pri" data-novo="Fornadas">${I.mais1} Nova fornada</button></div>
  <div class="filtros"><div class="chips">${chip('todos','Todos')}${chip('abertos','Em venda')}${chip('encerrados','Encerrados')}</div></div>
  ${semLote || semCusto ? `<section class="panel" style="margin-bottom:14px"><div class="grupo-top"><div><b>Registros de antes dos lotes</b>
    <div class="muted" style="font-size:13px">${[semLote ? `${semLote} ${semLote === 1 ? 'venda sem lote' : 'vendas sem lote'}` : '', semCusto ? `${semCusto} ${semCusto === 1 ? 'fornada sem número ou custo' : 'fornadas sem número ou custo'}` : ''].filter(Boolean).join(' · ')}</div></div>
    <button class="btn pri" data-ligar>Organizar agora</button></div></section>` : ''}
  ${ls.length ? `<div class="grid g2">${ls.map(card).join('')}</div>`
    : `<section class="panel vazio"><b>Nenhum lote ${filtro === 'todos' ? 'ainda' : 'aqui'}</b>Registre uma fornada sempre que produzir. O app grava o custo daquele dia e liga as vendas a ela.</section>`}`;
}

/* ============ CONFIGURAÇÕES ============ */
function telaConfig(){
  const c = S.config;
  return `<div class="head"><div><a href="#mais" class="muted" style="text-decoration:none;font-weight:600">‹ Mais</a><h1>Configurações</h1><p class="sub">Regras usadas em todos os cálculos</p></div></div>
  <section class="panel" style="max-width:640px"><form id="fcfg">
    <div class="campo"><label for="k_nome">Nome do negócio</label><input id="k_nome" value="${esc(c.nome_negocio || '')}" placeholder="Palha Italiana"></div>
    <div class="campo"><label>Regra da reserva da empresa</label><div class="seg" id="k_regra">
      <button type="button" data-v="igual_custo" class="${c.regra_reserva !== 'percentual' ? 'on' : ''}">Igual ao custo</button>
      <button type="button" data-v="percentual" class="${c.regra_reserva === 'percentual' ? 'on' : ''}">Percentual da venda</button></div></div>
    <div class="campo" id="k_pctbox"><label for="k_pct">Reserva (% do valor vendido)</label><input id="k_pct" type="number" step="any" inputmode="decimal" value="${c.reserva_percentual !== '' && c.reserva_percentual != null ? Math.round(pct(c.reserva_percentual)*1000)/10 : ''}"></div>
    <div class="duas"><div class="campo"><label for="k_rend">Rendimento padrão</label><input id="k_rend" type="number" inputmode="numeric" value="${esc(c.rendimento_padrao || '')}" placeholder="16"></div>
    <div class="campo"><label for="k_meta">Meta de lucro mensal (R$)</label><input id="k_meta" type="number" step="0.01" inputmode="decimal" value="${esc(c.meta_lucro_mensal || '')}"></div></div>
    <div class="campo"><label for="k_msg">Mensagem de cobrança no WhatsApp</label><textarea id="k_msg" placeholder="Oi, {nome}! Passando para lembrar do pagamento: {valor}.">${esc(c.mensagem_cobranca || '')}</textarea>
      <small class="muted">Use {nome} e {valor}; o app troca pelos dados do cliente.</small></div>
    <div class="campo"><label for="k_oferta">Mensagem para clientes sumidos</label><textarea id="k_oferta" placeholder="Oi, {nome}! Tem palha italiana fresquinha esta semana. Quer que eu separe para você?">${esc(c.mensagem_oferta || '')}</textarea></div>
    <div class="campo"><label for="k_alerta">Alerta de lote antigo (dias desde a fornada)</label><input id="k_alerta" type="number" inputmode="numeric" value="${esc(c.dias_alerta_lote || '')}" placeholder="7"></div>
    <button class="btn pri" type="submit">Salvar configurações</button></form></section>`;
}

/* ============ MODAL ============ */
function abrirModal(titulo, corpo, {salvar:txt = 'Salvar', excluir:podeExcluir = false} = {}){
  const m = $('#modal');
  m.innerHTML = `<form method="dialog" novalidate><div class="m-head"><h2>${titulo}</h2><button class="m-close" value="x" aria-label="Fechar">×</button></div>
    <div class="m-body">${corpo}</div>
    <div class="m-foot">${podeExcluir ? '<button type="button" class="btn perigo" data-del>Excluir</button>' : ''}
      <div class="dir"><button type="button" class="btn" data-cancel>Cancelar</button><button type="button" class="btn pri" data-ok>${txt}</button></div></div></form>`;
  m.onSalvar = null; m.onExcluir = null;
  const ok = m.querySelector('[data-ok]');
  const rodar = async (fn, botao) => {
    try{ botao.disabled = true; const t = botao.textContent; botao.textContent = 'Salvando…'; await fn(); m.close(); rota(); botao.textContent = t; }
    catch(e){ if (!e.silencioso) toast(e.message, true); botao.disabled = false; botao.textContent = botao === ok ? txt : 'Excluir'; }
  };
  ok.onclick = () => m.onSalvar && rodar(m.onSalvar, ok);
  m.querySelector('[data-cancel]').onclick = () => m.close();
  const del = m.querySelector('[data-del]');
  if (del) del.onclick = () => { if (confirm('Excluir este registro? Essa ação não pode ser desfeita.')) rodar(m.onExcluir, del); };
  m.showModal();
  return m;
}

/* ============ EVENTOS POR TELA ============ */
function ligar(base){
  const v = $('#view');
  v.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { S.mes = somaMes(S.mes, num(b.dataset.mes)); rota(); });
  v.querySelectorAll('[data-nova]').forEach(b => b.onclick = () => formVenda());
  v.querySelectorAll('[data-venda]').forEach(b => b.onclick = () => formVenda(b.dataset.venda));
  v.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { S.filtroStatus = b.dataset.fs; rota(); });
  v.querySelectorAll('[data-flote]').forEach(b => b.onclick = () => { S.filtroLote = b.dataset.flote; rota(); });
  v.querySelectorAll('[data-ligar]').forEach(b => b.onclick = () => organizarAntigos());
  const fl = v.querySelector('[data-fl]'); if (fl) fl.onchange = () => { S.filtroLocal = fl.value; rota(); };
  v.querySelectorAll('[data-novo]').forEach(b => b.onclick = () => formCadastro(b.dataset.novo));
  v.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => formCadastro(b.dataset.edit, b.dataset.id);
    b.onkeydown = e => { if (e.key === 'Enter') b.click(); }; });
  v.querySelectorAll('[data-novoitem]').forEach(b => b.onclick = () => formCadastro('ReceitaItens', null, {receita:b.dataset.novoitem}));
  v.querySelectorAll('[data-repassar]').forEach(b => b.onclick = () => formCadastro('Repasses', null, {local:b.dataset.repassar, valor:b.dataset.saldo, data:hoje()}));
  v.querySelectorAll('[data-recarregar]').forEach(b => b.onclick = async () => { b.disabled = true; try{ await carregar(); toast('Dados atualizados'); rota(); }catch(e){ toast(e.message, true); b.disabled = false; } });
  v.querySelectorAll('[data-pagar]').forEach(b => b.onclick = async () => {
    const vs = S.Vendas.filter(x => x.status !== 'Pago' && (x.cliente || 'Sem nome') === b.dataset.pagar);
    b.disabled = true; b.textContent = 'Salvando…';
    try{ for (const x of vs) await salvar('Vendas', {status:'Pago', forma_pagamento:b.dataset.forma, data_pagamento:hoje()}, x.id);
      toast(`${vs.length === 1 ? 'Venda marcada' : vs.length + ' vendas marcadas'} como paga${vs.length === 1 ? '' : 's'}`); rota(); }
    catch(e){ toast(e.message, true); rota(); }
  });
  if (base === 'config'){
    let regra = S.config.regra_reserva === 'percentual' ? 'percentual' : 'igual_custo';
    const box = v.querySelector('#k_pctbox'); const mostra = () => box.style.display = regra === 'percentual' ? '' : 'none'; mostra();
    v.querySelector('#k_regra').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; regra = b.dataset.v;
      v.querySelectorAll('#k_regra button').forEach(x => x.classList.toggle('on', x === b)); mostra(); };
    v.querySelector('#fcfg').onsubmit = async e => {
      e.preventDefault(); const btn = e.submitter || v.querySelector('#fcfg [type=submit]'); btn.disabled = true;
      const p = v.querySelector('#k_pct').value;
      const d = { nome_negocio:v.querySelector('#k_nome').value.trim(), regra_reserva:regra, reserva_percentual: p === '' ? '' : num(p) / 100,
        rendimento_padrao: v.querySelector('#k_rend').value ? num(v.querySelector('#k_rend').value) : '',
        meta_lucro_mensal: v.querySelector('#k_meta').value ? num(v.querySelector('#k_meta').value) : '', mensagem_cobranca:v.querySelector('#k_msg').value.trim(),
        mensagem_oferta:v.querySelector('#k_oferta').value.trim(), dias_alerta_lote: v.querySelector('#k_alerta').value ? num(v.querySelector('#k_alerta').value) : '' };
      try{ S.config = await api('setConfig', {data:d}); toast('Configurações salvas'); if (S.config.nome_negocio) $('#brand').firstChild.textContent = S.config.nome_negocio; }
      catch(err){ toast(err.message, true); } btn.disabled = false;
    };
  }
}

/* ============ INÍCIO ============ */
async function iniciar(){
  montarNav();
  window.addEventListener('hashchange', () => { rota(); $('#view').focus({preventScroll:true}); window.scrollTo(0,0); });
  if (API_URL.startsWith('COLE_') || TOKEN.startsWith('COLE_')){
    $('#view').innerHTML = `<section class="panel vazio" style="max-width:560px;margin:10vh auto"><b>Falta conectar a planilha</b>
      Abra o arquivo index.html, procure por <code>API_URL</code> e <code>TOKEN</code> no início do script e cole a URL do App da Web do Apps Script e o token que você definiu.</section>`;
    return;
  }
  try{ await carregar(); rota(); }
  catch(e){
    $('#view').innerHTML = `<section class="panel vazio" style="max-width:560px;margin:10vh auto"><b>Não foi possível carregar os dados</b>${esc(e.message)}
      <div style="margin-top:16px"><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div></section>`;
  }
}
iniciar();
</script>
